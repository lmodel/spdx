      could be used during the inference.'
    range: PresenceType
  buildEndTime:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/Build/buildEndTime
    description: Property that describes the time at which a build stops.
    range: datetime
  buildId:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/Build/buildId
    description: 'A buildId is a locally unique identifier used by a builder to identify
