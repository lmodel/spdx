id: https://w3id.org/lmodel/spdx
name: spdx
title: spdx
description: System Package Data Exchange (SPDX), LinkML schema
comments: >-
  This ontology defines the terms and relationships used in the SPDX specification
  to describe system packages
license: Apache-2.0
see_also:
- https://lmodel.github.io/spdx
- https://spdx.dev/specifications/
version: 3.0.1
source: https://spdx.github.io/spdx-spec/v3.0/rdf/spdx-model.ttl

prefixes:
  spdx: https://spdx.org/rdf/3.0.1/terms/
  core: https://spdx.org/rdf/3.0.1/terms/Core/
  ai: https://spdx.org/rdf/3.0.1/terms/AI/
  build: https://spdx.org/rdf/3.0.1/terms/Build/
  dataset: https://spdx.org/rdf/3.0.1/terms/Dataset/
  security: https://spdx.org/rdf/3.0.1/terms/Security/
  software: https://spdx.org/rdf/3.0.1/terms/Software/
  expandedlicensing: https://spdx.org/rdf/3.0.1/terms/ExpandedLicensing/
  simplelicensing: https://spdx.org/rdf/3.0.1/terms/SimpleLicensing/
  extension: https://spdx.org/rdf/3.0.1/terms/Extension/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: spdx
default_range: string
imports:
- linkml:types
enums:
  EnergyUnitType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/AI/EnergyUnitType
    permissible_values:
      kilowattHour:
        meaning: https://spdx.org/rdf/3.0.1/terms/AI/EnergyUnitType/kilowattHour
        description: Kilowatt-hour.
      megajoule:
        meaning: https://spdx.org/rdf/3.0.1/terms/AI/EnergyUnitType/megajoule
        description: Megajoule.
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/AI/EnergyUnitType/other
        description: Any other units of energy measurement.
    description: Specifies the unit of energy consumption.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  SafetyRiskAssessmentType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/AI/SafetyRiskAssessmentType
    permissible_values:
      high:
        meaning: https://spdx.org/rdf/3.0.1/terms/AI/SafetyRiskAssessmentType/high
        description: The second-highest level of risk posed by an AI system.
      low:
        meaning: https://spdx.org/rdf/3.0.1/terms/AI/SafetyRiskAssessmentType/low
        description: Low/no risk is posed by an AI system.
      medium:
        meaning: https://spdx.org/rdf/3.0.1/terms/AI/SafetyRiskAssessmentType/medium
        description: The third-highest level of risk posed by an AI system.
      serious:
        meaning: https://spdx.org/rdf/3.0.1/terms/AI/SafetyRiskAssessmentType/serious
        description: The highest level of risk posed by an AI system.
    description: Specifies the safety risk level.
  AnnotationType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/AnnotationType
    permissible_values:
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/AnnotationType/other
        description: Used to store extra information about an Element which is not
          part of a review (e.g. extra information provided during the creation of
          the Element).
      review:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/AnnotationType/review
        description: Used when someone reviews the Element.
    description: Specifies the type of an annotation.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  ExternalIdentifierType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType
    permissible_values:
      cpe22:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/cpe22
        description: '[Common Platform Enumeration Specification 2.2](https://cpe.mitre.org/files/cpe-specification_2.2.pdf)'
      cpe23:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/cpe23
        description: '[Common Platform Enumeration: Naming Specification Version 2.3](https://csrc.nist.gov/publications/detail/nistir/7695/final)'
      cve:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/cve
        description: Common Vulnerabilities and Exposures identifiers, an identifier
          for a specific software flaw defined within the official CVE Dictionary
          and that conforms to the [CVE specification](https://csrc.nist.gov/glossary/term/cve_id).
      email:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/email
        description: Email address, as defined in [RFC 3696](https://datatracker.ietf.org/doc/rfc3986/)
          Section 3.
      gitoid:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/gitoid
        description: '[Gitoid](https://www.iana.org/assignments/uri-schemes/prov/gitoid),
          stands for [Git Object ID](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects).
          A gitoid of type blob is a unique hash of a binary artifact. A gitoid may
          represent either an [Artifact Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-identifier-types)
          for the software artifact or an [Input Manifest Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#input-manifest-identifier)
          for the software artifact''s associated [Artifact Input Manifest](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-input-manifest);
          this ambiguity exists because the Artifact Input Manifest is itself an artifact,
          and the gitoid of that artifact is its valid identifier. Gitoids calculated
          on software artifacts (Snippet, File, or Package Elements) should be recorded
          in the SPDX 3.0 SoftwareArtifact''s contentIdentifier property. Gitoids
          calculated on the Artifact Input Manifest (Input Manifest Identifier) should
          be recorded in the SPDX 3.0 Element''s externalIdentifier property. See
          [OmniBOR Specification](https://github.com/omnibor/spec/), a minimalistic
          specification for describing software [Artifact Dependency Graphs](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-dependency-graph-adg).'
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/other
        description: Used when the type does not match any of the other options.
      packageUrl:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/packageUrl
        description: Package URL, as defined in the corresponding [Annex](../../../annexes/pkg-url-specification.md)
          of this specification.
      securityOther:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/securityOther
        description: Used when there is a security related identifier of unspecified
          type.
      swhid:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/swhid
        description: SoftWare Hash IDentifier, a persistent intrinsic identifier for
          digital artifacts, such as files, trees (also known as directories or folders),
          commits, and other objects typically found in version control systems. The
          format of the identifiers is defined in the [SWHID specification](https://www.swhid.org/specification/v1.1/4.Syntax)
          (ISO/IEC DIS 18670). They typically look like `swh:1:cnt:94a9ed024d3859793618152ea559a168bbcbb5e2`.
      swid:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/swid
        description: Concise Software Identification (CoSWID) tag, as defined in [RFC
          9393](https://datatracker.ietf.org/doc/rfc9393/) Section 2.3.
      urlScheme:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalIdentifierType/urlScheme
        description: '[Uniform Resource Identifier (URI) Schemes](https://www.iana.org/assignments/uri-schemes/uri-schemes.xhtml).
          The scheme used in order to locate a resource.'
    description: Specifies the type of an external identifier.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  ExternalRefType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType
    permissible_values:
      altDownloadLocation:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/altDownloadLocation
        description: A reference to an alternative download location.
      altWebPage:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/altWebPage
        description: A reference to an alternative web page.
      binaryArtifact:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/binaryArtifact
        description: A reference to binary artifacts related to a package.
      bower:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/bower
        description: A reference to a Bower package. The package locator format, looks
          like `package#version`, is defined in the "install" section of [Bower API
          documentation](https://bower.io/docs/api/#install).
      buildMeta:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/buildMeta
        description: A reference build metadata related to a published package.
      buildSystem:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/buildSystem
        description: A reference build system used to create or publish the package.
      certificationReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/certificationReport
        description: A reference to a certification report for a package from an accredited/independent
          body.
      chat:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/chat
        description: A reference to the instant messaging system used by the maintainer
          for a package.
      componentAnalysisReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/componentAnalysisReport
        description: A reference to a Software Composition Analysis (SCA) report.
      cwe:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/cwe
        description: '[Common Weakness Enumeration](https://csrc.nist.gov/glossary/term/common_weakness_enumeration).
          A reference to a source of software flaw defined within the official [CWE
          List](https://cwe.mitre.org/data/) that conforms to the [CWE specification](https://cwe.mitre.org/).'
      documentation:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/documentation
        description: A reference to the documentation for a package.
      dynamicAnalysisReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/dynamicAnalysisReport
        description: A reference to a dynamic analysis report for a package.
      eolNotice:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/eolNotice
        description: A reference to the End Of Sale (EOS) and/or End Of Life (EOL)
          information related to a package.
      exportControlAssessment:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/exportControlAssessment
        description: A reference to a export control assessment for a package.
      funding:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/funding
        description: A reference to funding information related to a package.
      issueTracker:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/issueTracker
        description: A reference to the issue tracker for a package.
      license:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/license
        description: A reference to additional license information related to an artifact.
      mailingList:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/mailingList
        description: A reference to the mailing list used by the maintainer for a
          package.
      mavenCentral:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/mavenCentral
        description: A reference to a Maven repository artifact. The artifact locator
          format is defined in the [Maven documentation](https://maven.apache.org/guides/mini/guide-naming-conventions.html)
          and looks like `groupId:artifactId[:version]`.
      metrics:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/metrics
        description: A reference to metrics related to package such as OpenSSF scorecards.
      npm:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/npm
        description: A reference to an npm package. The package locator format is
          defined in the [npm documentation](https://docs.npmjs.com/cli/v10/configuring-npm/package-json)
          and looks like `package@version`.
      nuget:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/nuget
        description: A reference to a NuGet package. The package locator format is
          defined in the [NuGet documentation](https://docs.nuget.org) and looks like
          `package/version`.
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/other
        description: Used when the type does not match any of the other options.
      privacyAssessment:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/privacyAssessment
        description: A reference to a privacy assessment for a package.
      productMetadata:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/productMetadata
        description: A reference to additional product metadata such as reference
          within organization's product catalog.
      purchaseOrder:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/purchaseOrder
        description: A reference to a purchase order for a package.
      qualityAssessmentReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/qualityAssessmentReport
        description: A reference to a quality assessment for a package.
      releaseHistory:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/releaseHistory
        description: A reference to a published list of releases for a package.
      releaseNotes:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/releaseNotes
        description: A reference to the release notes for a package.
      riskAssessment:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/riskAssessment
        description: A reference to a risk assessment for a package.
      runtimeAnalysisReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/runtimeAnalysisReport
        description: A reference to a runtime analysis report for a package.
      secureSoftwareAttestation:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/secureSoftwareAttestation
        description: A reference to information assuring that the software is developed
          using security practices as defined by [NIST SP 800-218 Secure Software
          Development Framework (SSDF) Version 1.1](https://csrc.nist.gov/pubs/sp/800/218/final)
          or [CISA Secure Software Development Attestation Form](https://www.cisa.gov/resources-tools/resources/secure-software-development-attestation-form).
      securityAdversaryModel:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/securityAdversaryModel
        description: A reference to the security adversary model for a package.
      securityAdvisory:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/securityAdvisory
        description: A reference to a published security advisory (where advisory
          as defined per [ISO 29147:2018](https://www.iso.org/standard/72311.html))
          that may affect one or more elements, e.g., vendor advisories or specific
          NVD entries.
      securityFix:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/securityFix
        description: A reference to the patch or source code that fixes a vulnerability.
      securityOther:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/securityOther
        description: A reference to related security information of unspecified type.
      securityPenTestReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/securityPenTestReport
        description: A reference to a [penetration test](https://en.wikipedia.org/wiki/Penetration_test)
          report for a package.
      securityPolicy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/securityPolicy
        description: A reference to instructions for reporting newly discovered security
          vulnerabilities for a package.
      securityThreatModel:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/securityThreatModel
        description: A reference the [security threat model](https://en.wikipedia.org/wiki/Threat_model)
          for a package.
      socialMedia:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/socialMedia
        description: A reference to a social media channel for a package.
      sourceArtifact:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/sourceArtifact
        description: A reference to an artifact containing the sources for a package.
      staticAnalysisReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/staticAnalysisReport
        description: A reference to a static analysis report for a package.
      support:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/support
        description: A reference to the software support channel or other support
          information for a package.
      vcs:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/vcs
        description: A reference to a version control system related to a software
          artifact.
      vulnerabilityDisclosureReport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/vulnerabilityDisclosureReport
        description: A reference to a Vulnerability Disclosure Report (VDR) which
          provides the software supplier's analysis and findings describing the impact
          (or lack of impact) that reported vulnerabilities have on packages or products
          in the supplier's SBOM as defined in [NIST SP 800-161 Cybersecurity Supply
          Chain Risk Management Practices for Systems and Organizations](https://csrc.nist.gov/pubs/sp/800/161/r1/final).
      vulnerabilityExploitabilityAssessment:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ExternalRefType/vulnerabilityExploitabilityAssessment
        description: A reference to a Vulnerability Exploitability eXchange (VEX)
          statement which provides information on whether a product is impacted by
          a specific vulnerability in an included package and, if affected, whether
          there are actions recommended to remediate. See also [NTIA VEX one-page
          summary](https://ntia.gov/files/ntia/publications/vex_one-page_summary.pdf).
    description: Specifies the type of an external reference.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  HashAlgorithm:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm
    permissible_values:
      adler32:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/adler32
        description: Adler-32 checksum is part of the widely used zlib compression
          library as defined in [RFC 1950](https://datatracker.ietf.org/doc/rfc1950/)
          Section 2.3.
      blake2b256:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/blake2b256
        description: BLAKE2b algorithm with a digest size of 256, as defined in [RFC
          7693](https://datatracker.ietf.org/doc/rfc7693/) Section 4.
      blake2b384:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/blake2b384
        description: BLAKE2b algorithm with a digest size of 384, as defined in [RFC
          7693](https://datatracker.ietf.org/doc/rfc7693/) Section 4.
      blake2b512:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/blake2b512
        description: BLAKE2b algorithm with a digest size of 512, as defined in [RFC
          7693](https://datatracker.ietf.org/doc/rfc7693/) Section 4.
      blake3:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/blake3
        description: '[BLAKE3](https://github.com/BLAKE3-team/BLAKE3-specs/blob/master/blake3.pdf)'
      crystalsDilithium:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/crystalsDilithium
        description: '[Dilithium](https://pq-crystals.org/dilithium/)'
      crystalsKyber:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/crystalsKyber
        description: '[Kyber](https://pq-crystals.org/kyber/)'
      falcon:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/falcon
        description: '[FALCON](https://falcon-sign.info/falcon.pdf)'
      md2:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/md2
        description: MD2 message-digest algorithm, as defined in [RFC 1319](https://datatracker.ietf.org/doc/rfc1319/).
      md4:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/md4
        description: MD4 message-digest algorithm, as defined in [RFC 1186](https://datatracker.ietf.org/doc/rfc1186/).
      md5:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/md5
        description: MD5 message-digest algorithm, as defined in [RFC 1321](https://datatracker.ietf.org/doc/rfc1321/).
      md6:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/md6
        description: '[MD6 hash function](https://people.csail.mit.edu/rivest/pubs/RABCx08.pdf)'
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/other
        description: any hashing algorithm that does not exist in this list of entries
      sha1:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha1
        description: SHA-1, a secure hashing algorithm, as defined in [RFC 3174](https://datatracker.ietf.org/doc/rfc3174/).
      sha224:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha224
        description: SHA-2 with a digest length of 224, as defined in [RFC 3874](https://datatracker.ietf.org/doc/rfc3874/).
      sha256:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha256
        description: SHA-2 with a digest length of 256, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
      sha384:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha384
        description: SHA-2 with a digest length of 384, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
      sha3_224:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha3_224
        description: SHA-3 with a digest length of 224, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
      sha3_256:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha3_256
        description: SHA-3 with a digest length of 256, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
      sha3_384:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha3_384
        description: SHA-3 with a digest length of 384, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
      sha3_512:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha3_512
        description: SHA-3 with a digest length of 512, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
      sha512:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/HashAlgorithm/sha512
        description: SHA-2 with a digest length of 512, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
    description: A mathematical algorithm that maps data of arbitrary size to a bit
      string.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  LifecycleScopeType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/LifecycleScopeType
    permissible_values:
      build:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/LifecycleScopeType/build
        description: A relationship has specific context implications during an element's
          build phase, during development.
      design:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/LifecycleScopeType/design
        description: A relationship has specific context implications during an element's
          design.
      development:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/LifecycleScopeType/development
        description: A relationship has specific context implications during development
          phase of an element.
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/LifecycleScopeType/other
        description: A relationship has other specific context information necessary
          to capture that the above set of enumerations does not handle.
      runtime:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/LifecycleScopeType/runtime
        description: A relationship has specific context implications during the execution
          phase of an element.
      test:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/LifecycleScopeType/test
        description: A relationship has specific context implications during an element's
          testing phase, during development.
    description: Provide an enumerated set of lifecycle phases that can provide context
      to relationships.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  PresenceType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/PresenceType
    permissible_values:
      'no':
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/PresenceType/no
        description: Indicates absence of the field.
      noAssertion:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/PresenceType/noAssertion
        description: Makes no assertion about the field.
      'yes':
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/PresenceType/yes
        description: Indicates presence of the field.
    description: Categories of presence or absence.
  ProfileIdentifierType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType
    permissible_values:
      ai:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/ai
        description: the element follows the AI profile specification
      build:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/build
        description: the element follows the Build profile specification
      core:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/core
        description: the element follows the Core profile specification
      dataset:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/dataset
        description: the element follows the Dataset profile specification
      expandedLicensing:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/expandedLicensing
        description: the element follows the ExpandedLicensing profile specification
      extension:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/extension
        description: the element follows the Extension profile specification
      lite:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/lite
        description: the element follows the Lite profile specification
      security:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/security
        description: the element follows the Security profile specification
      simpleLicensing:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/simpleLicensing
        description: the element follows the SimpleLicensing profile specification
      software:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/ProfileIdentifierType/software
        description: the element follows the Software profile specification
    description: Enumeration of the valid profiles.
  RelationshipCompleteness:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipCompleteness
    permissible_values:
      complete:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipCompleteness/complete
        description: The relationship is known to be exhaustive.
      incomplete:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipCompleteness/incomplete
        description: The relationship is known not to be exhaustive.
      noAssertion:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipCompleteness/noAssertion
        description: No assertion can be made about the completeness of the relationship.
    description: Indicates whether a relationship is known to be complete, incomplete,
      or if no assertion is made with respect to relationship completeness.
  RelationshipType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType
    permissible_values:
      affects:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/affects
        description: The `from` Vulnerability affects each `to` Element. The use of
          the `affects` type is constrained to `VexAffectedVulnAssessmentRelationship`
          classed relationships.
      amendedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/amendedBy
        description: The `from` Element is amended by each `to` Element.
      ancestorOf:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/ancestorOf
        description: The `from` Element is an ancestor of each `to` Element.
      availableFrom:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/availableFrom
        description: The `from` Element is available from the additional supplier
          described by each `to` Element.
      configures:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/configures
        description: The `from` Element is a configuration applied to each `to` Element,
          during a LifecycleScopeType period.
      contains:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/contains
        description: The `from` Element contains each `to` Element.
      coordinatedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/coordinatedBy
        description: The `from` Vulnerability is coordinatedBy the `to` Agent(s) (vendor,
          researcher, or consumer agent).
      copiedTo:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/copiedTo
        description: The `from` Element has been copied to each `to` Element.
      delegatedTo:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/delegatedTo
        description: The `from` Agent is delegating an action to the Agent of the
          `to` Relationship (which must be of type invokedBy), during a LifecycleScopeType
          (e.g. the `to` invokedBy Relationship is being done on behalf of `from`).
      dependsOn:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/dependsOn
        description: The `from` Element depends on each `to` Element, during a LifecycleScopeType
          period.
      descendantOf:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/descendantOf
        description: The `from` Element is a descendant of each `to` Element.
      describes:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/describes
        description: The `from` Element describes each `to` Element. To denote the
          root(s) of a tree of elements in a collection, the rootElement property
          should be used.
      doesNotAffect:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/doesNotAffect
        description: The `from` Vulnerability has no impact on each `to` Element.
          The use of the `doesNotAffect` is constrained to `VexNotAffectedVulnAssessmentRelationship`
          classed relationships.
      expandsTo:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/expandsTo
        description: The `from` archive expands out as an artifact described by each
          `to` Element.
      exploitCreatedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/exploitCreatedBy
        description: The `from` Vulnerability has had an exploit created against it
          by each `to` Agent.
      fixedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/fixedBy
        description: Designates a `from` Vulnerability has been fixed by the `to`
          Agent(s).
      fixedIn:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/fixedIn
        description: A `from` Vulnerability has been fixed in each `to` Element. The
          use of the `fixedIn` type is constrained to `VexFixedVulnAssessmentRelationship`
          classed relationships.
      foundBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/foundBy
        description: Designates a `from` Vulnerability was originally discovered by
          the `to` Agent(s).
      generates:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/generates
        description: The `from` Element generates each `to` Element.
      hasAddedFile:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasAddedFile
        description: Every `to` Element is a file added to the `from` Element (`from`
          hasAddedFile `to`).
      hasAssessmentFor:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasAssessmentFor
        description: Relates a `from` Vulnerability and each `to` Element with a security
          assessment. To be used with `VulnAssessmentRelationship` types.
      hasAssociatedVulnerability:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasAssociatedVulnerability
        description: Used to associate a `from` Artifact with each `to` Vulnerability.
      hasConcludedLicense:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasConcludedLicense
        description: The `from` SoftwareArtifact is concluded by the SPDX data creator
          to be governed by each `to` license.
      hasDataFile:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasDataFile
        description: 'The `from` Element treats each `to` Element as a data file.
          A data file is an artifact that stores data required or optional for the
          `from` Element''s functionality. A data file can be a database file, an
          index file, a log file, an AI model file, a calibration data file, a temporary
          file, a backup file, and more. For AI training dataset, test dataset, test
          artifact, configuration data, build input data, and build output data, please
          consider using the more specific relationship types: `trainedOn`, `testedOn`,
          `hasTest`, `configures`, `hasInput`, and `hasOutput`, respectively. This
          relationship does not imply dependency.'
      hasDeclaredLicense:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasDeclaredLicense
        description: The `from` SoftwareArtifact was discovered to actually contain
          each `to` license, for example as detected by use of automated tooling.
      hasDeletedFile:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasDeletedFile
        description: Every `to` Element is a file deleted from the `from` Element
          (`from` hasDeletedFile `to`).
      hasDependencyManifest:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasDependencyManifest
        description: The `from` Element has manifest files that contain dependency
          information in each `to` Element.
      hasDistributionArtifact:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasDistributionArtifact
        description: The `from` Element is distributed as an artifact in each `to`
          Element (e.g. an RPM or archive file).
      hasDocumentation:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasDocumentation
        description: The `from` Element is documented by each `to` Element.
      hasDynamicLink:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasDynamicLink
        description: The `from` Element dynamically links in each `to` Element, during
          a LifecycleScopeType period.
      hasEvidence:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasEvidence
        description: Every `to` Element is considered as evidence for the `from` Element
          (`from` hasEvidence `to`).
      hasExample:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasExample
        description: Every `to` Element is an example for the `from` Element (`from`
          hasExample `to`).
      hasHost:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasHost
        description: The `from` Build was run on the `to` Element during a LifecycleScopeType
          period (e.g. the host that the build runs on).
      hasInput:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasInput
        description: The `from` Build has each `to` Element as an input, during a
          LifecycleScopeType period.
      hasMetadata:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasMetadata
        description: Every `to` Element is metadata about the `from` Element (`from`
          hasMetadata `to`).
      hasOptionalComponent:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasOptionalComponent
        description: Every `to` Element is an optional component of the `from` Element
          (`from` hasOptionalComponent `to`).
      hasOptionalDependency:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasOptionalDependency
        description: The `from` Element optionally depends on each `to` Element, during
          a LifecycleScopeType period.
      hasOutput:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasOutput
        description: The `from` Build element generates each `to` Element as an output,
          during a LifecycleScopeType period.
      hasPrerequisite:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasPrerequisite
        description: The `from` Element has a prerequisite on each `to` Element, during
          a LifecycleScopeType period.
      hasProvidedDependency:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasProvidedDependency
        description: The `from` Element has a dependency on each `to` Element, dependency
          is not in the distributed artifact, but assumed to be provided, during a
          LifecycleScopeType period.
      hasRequirement:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasRequirement
        description: The `from` Element has a requirement on each `to` Element, during
          a LifecycleScopeType period.
      hasSpecification:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasSpecification
        description: Every `to` Element is a specification for the `from` Element
          (`from` hasSpecification `to`), during a LifecycleScopeType period.
      hasStaticLink:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasStaticLink
        description: The `from` Element statically links in each `to` Element, during
          a LifecycleScopeType period.
      hasTest:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasTest
        description: Every `to` Element is a test artifact for the `from` Element
          (`from` hasTest `to`), during a LifecycleScopeType period.
      hasTestCase:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasTestCase
        description: Every `to` Element is a test case for the `from` Element (`from`
          hasTestCase `to`).
      hasVariant:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/hasVariant
        description: Every `to` Element is a variant the `from` Element (`from` hasVariant
          `to`).
      invokedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/invokedBy
        description: The `from` Element was invoked by the `to` Agent, during a LifecycleScopeType
          period (for example, a Build element that describes a build step).
      modifiedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/modifiedBy
        description: The `from` Element is modified by each `to` Element.
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/other
        description: Every `to` Element is related to the `from` Element where the
          relationship type is not described by any of the SPDX relationship types
          (this relationship is directionless).
      packagedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/packagedBy
        description: Every `to` Element is a packaged instance of the `from` Element
          (`from` packagedBy `to`).
      patchedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/patchedBy
        description: Every `to` Element is a patch for the `from` Element (`from`
          patchedBy `to`).
      publishedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/publishedBy
        description: Designates a `from` Vulnerability was made available for public
          use or reference by each `to` Agent.
      reportedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/reportedBy
        description: Designates a `from` Vulnerability was first reported to a project,
          vendor, or tracking database for formal identification by each `to` Agent.
      republishedBy:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/republishedBy
        description: Designates a `from` Vulnerability's details were tracked, aggregated,
          and/or enriched to improve context (i.e. NVD) by each `to` Agent.
      serializedInArtifact:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/serializedInArtifact
        description: The `from` SpdxDocument can be found in a serialized form in
          each `to` Artifact.
      testedOn:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/testedOn
        description: The `from` Element has been tested on the `to` Element(s).
      trainedOn:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/trainedOn
        description: The `from` Element has been trained on the `to` Element(s).
      underInvestigationFor:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/underInvestigationFor
        description: The `from` Vulnerability impact is being investigated for each
          `to` Element. The use of the `underInvestigationFor` type is constrained
          to `VexUnderInvestigationVulnAssessmentRelationship` classed relationships.
      usesTool:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/RelationshipType/usesTool
        description: The `from` Element uses each `to` Element as a tool, during a
          LifecycleScopeType period.
    description: Information about the relationship between two Elements.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  SupportType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Core/SupportType
    permissible_values:
      deployed:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/SupportType/deployed
        description: in addition to being supported by the supplier, the software
          is known to have been deployed and is in use.  For a software as a service
          provider, this implies the software is now available as a service.
      development:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/SupportType/development
        description: the artifact is in active development and is not considered ready
          for formal support from the supplier.
      endOfSupport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/SupportType/endOfSupport
        description: there is a defined end of support for the artifact from the supplier.  This
          may also be referred to as end of life. There is a validUntilDate that can
          be used to signal when support ends for the artifact.
      limitedSupport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/SupportType/limitedSupport
        description: the artifact has been released, and there is limited support
          available from the supplier. There is a validUntilDate that can provide
          additional information about the duration of support.
      noAssertion:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/SupportType/noAssertion
        description: no assertion about the type of support is made.   This is considered
          the default if no other support type is used.
      noSupport:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/SupportType/noSupport
        description: there is no support for the artifact from the supplier, consumer
          assumes any support obligations.
      support:
        meaning: https://spdx.org/rdf/3.0.1/terms/Core/SupportType/support
        description: the artifact has been released, and is supported from the supplier.   There
          is a validUntilDate that can provide additional information about the duration
          of support.
    description: Indicates the type of support that is associated with an artifact.
  ConfidentialityLevelType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Dataset/ConfidentialityLevelType
    permissible_values:
      amber:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/ConfidentialityLevelType/amber
        description: Data points in the dataset can be shared only with specific organizations
          and their clients on a need to know basis.
      clear:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/ConfidentialityLevelType/clear
        description: Dataset may be distributed freely, without restriction.
      green:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/ConfidentialityLevelType/green
        description: Dataset can be shared within a community of peers and partners.
      red:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/ConfidentialityLevelType/red
        description: Data points in the dataset are highly confidential and can only
          be shared with named recipients.
    description: Categories of confidentiality level.
  DatasetAvailabilityType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetAvailabilityType
    permissible_values:
      clickthrough:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetAvailabilityType/clickthrough
        description: the dataset is not publicly available and can only be accessed
          after affirmatively accepting terms on a clickthrough webpage.
      directDownload:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetAvailabilityType/directDownload
        description: the dataset is publicly available and can be downloaded directly.
      query:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetAvailabilityType/query
        description: the dataset is publicly available, but not all at once, and can
          only be accessed through queries which return parts of the dataset.
      registration:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetAvailabilityType/registration
        description: the dataset is not publicly available and an email registration
          is required before accessing the dataset, although without an affirmative
          acceptance of terms.
      scrapingScript:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetAvailabilityType/scrapingScript
        description: the dataset provider is not making available the underlying data
          and the dataset must be reassembled, typically using the provided script
          for scraping the data.
    description: Availability of dataset.
  DatasetType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType
    permissible_values:
      audio:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/audio
        description: data is audio based, such as a collection of music from the 80s.
      categorical:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/categorical
        description: data that is classified into a discrete number of categories,
          such as the eye color of a population of people.
      graph:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/graph
        description: data is in the form of a graph where entries are somehow related
          to each other through edges, such a social network of friends.
      image:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/image
        description: data is a collection of images such as pictures of animals.
      noAssertion:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/noAssertion
        description: data type is not known.
      numeric:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/numeric
        description: data consists only of numeric entries.
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/other
        description: data is of a type not included in this list.
      sensor:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/sensor
        description: data is recorded from a physical sensor, such as a thermometer
          reading or biometric device.
      structured:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/structured
        description: data is stored in tabular format or retrieved from a relational
          database.
      syntactic:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/syntactic
        description: data describes the syntax or semantics of a language or text,
          such as a parse tree used for natural language processing.
      text:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/text
        description: data consists of unstructured text, such as a book, Wikipedia
          article (without images), or transcript.
      timeseries:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/timeseries
        description: data is recorded in an ordered sequence of timestamped entries,
          such as the price of a stock over the course of a day.
      timestamp:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/timestamp
        description: data is recorded with a timestamp for each entry, but not necessarily
          ordered or at specific intervals, such as when a taxi ride starts and ends.
      video:
        meaning: https://spdx.org/rdf/3.0.1/terms/Dataset/DatasetType/video
        description: data is video based, such as a collection of movie clips featuring
          Tom Hanks.
    description: Enumeration of dataset types.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  CvssSeverityType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Security/CvssSeverityType
    permissible_values:
      critical:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/CvssSeverityType/critical
        description: When a CVSS score is between 9.0 - 10.0
      high:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/CvssSeverityType/high
        description: When a CVSS score is between 7.0 - 8.9
      low:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/CvssSeverityType/low
        description: When a CVSS score is between 0.1 - 3.9
      medium:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/CvssSeverityType/medium
        description: When a CVSS score is between 4.0 - 6.9
      none:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/CvssSeverityType/none
        description: When a CVSS score is 0.0
    description: Specifies the CVSS base, temporal, threat, or environmental severity
      type.
  ExploitCatalogType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Security/ExploitCatalogType
    permissible_values:
      kev:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/ExploitCatalogType/kev
        description: CISA's Known Exploited Vulnerability (KEV) Catalog
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/ExploitCatalogType/other
        description: Other exploit catalogs
    description: Specifies the exploit catalog type.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
  SsvcDecisionType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Security/SsvcDecisionType
    permissible_values:
      act:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/SsvcDecisionType/act
        description: The vulnerability requires attention from the organization's
          internal, supervisory-level and leadership-level individuals. Necessary
          actions include requesting assistance or information about the vulnerability,
          as well as publishing a notification either internally and/or externally.
          Typically, internal groups would meet to determine the overall response
          and then execute agreed upon actions. CISA recommends remediating Act vulnerabilities
          as soon as possible.
      attend:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/SsvcDecisionType/attend
        description: The vulnerability requires attention from the organization's
          internal, supervisory-level individuals. Necessary actions include requesting
          assistance or information about the vulnerability, and may involve publishing
          a notification either internally and/or externally. CISA recommends remediating
          Attend vulnerabilities sooner than standard update timelines.
      track:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/SsvcDecisionType/track
        description: The vulnerability does not require action at this time. The organization
          would continue to track the vulnerability and reassess it if new information
          becomes available. CISA recommends remediating Track vulnerabilities within
          standard update timelines.
      trackStar:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/SsvcDecisionType/trackStar
        description: ("Track\*" in the SSVC spec) The vulnerability contains specific
          characteristics that may require closer monitoring for changes. CISA recommends
          remediating Track\* vulnerabilities within standard update timelines.
    description: Specifies the SSVC decision type.
  VexJustificationType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Security/VexJustificationType
    permissible_values:
      componentNotPresent:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/VexJustificationType/componentNotPresent
        description: The software is not affected because the vulnerable component
          is not in the product.
      inlineMitigationsAlreadyExist:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/VexJustificationType/inlineMitigationsAlreadyExist
        description: Built-in inline controls or mitigations prevent an adversary
          from leveraging the vulnerability.
      vulnerableCodeCannotBeControlledByAdversary:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/VexJustificationType/vulnerableCodeCannotBeControlledByAdversary
        description: The vulnerable component is present, and the component contains
          the vulnerable code. However, vulnerable code is used in such a way that
          an attacker cannot mount any anticipated attack.
      vulnerableCodeNotInExecutePath:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/VexJustificationType/vulnerableCodeNotInExecutePath
        description: The affected code is not reachable through the execution of the
          code, including non-anticipated states of the product.
      vulnerableCodeNotPresent:
        meaning: https://spdx.org/rdf/3.0.1/terms/Security/VexJustificationType/vulnerableCodeNotPresent
        description: The product is not affected because the code underlying the vulnerability
          is not present in the product.
    description: Specifies the VEX justification type.
  ContentIdentifierType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Software/ContentIdentifierType
    permissible_values:
      gitoid:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/ContentIdentifierType/gitoid
        description: '[Gitoid](https://www.iana.org/assignments/uri-schemes/prov/gitoid),
          stands for [Git Object ID](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects).
          A gitoid of type blob is a unique hash of a binary artifact. A gitoid may
          represent either an [Artifact Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-identifier-types)
          for the software artifact or an [Input Manifest Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#input-manifest-identifier)
          for the software artifact''s associated [Artifact Input Manifest](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-input-manifest);
          this ambiguity exists because the Artifact Input Manifest is itself an artifact,
          and the gitoid of that artifact is its valid identifier. Gitoids calculated
          on software artifacts (Snippet, File, or Package Elements) should be recorded
          in the SPDX 3.0 SoftwareArtifact''s contentIdentifier property. Gitoids
          calculated on the Artifact Input Manifest (Input Manifest Identifier) should
          be recorded in the SPDX 3.0 Element''s externalIdentifier property. See
          [OmniBOR Specification](https://github.com/omnibor/spec/), a minimalistic
          specification for describing software [Artifact Dependency Graphs](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-dependency-graph-adg).'
      swhid:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/ContentIdentifierType/swhid
        description: SoftWare Hash IDentifier, a persistent intrinsic identifier for
          digital artifacts, such as files, trees (also known as directories or folders),
          commits, and other objects typically found in version control systems. The
          format of the identifiers is defined in the [SWHID specification](https://www.swhid.org/specification/v1.1/4.Syntax)
          (ISO/IEC DIS 18670). They typically look like `swh:1:cnt:94a9ed024d3859793618152ea559a168bbcbb5e2`.
    description: Specifies the type of a content identifier.
  FileKindType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Software/FileKindType
    permissible_values:
      directory:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/FileKindType/directory
        description: The file represents a directory and all content stored in that
          directory.
      file:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/FileKindType/file
        description: The file represents a single file (default).
    description: Enumeration of the different kinds of SPDX file.
  SbomType:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Software/SbomType
    permissible_values:
      analyzed:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SbomType/analyzed
        description: SBOM generated through analysis of artifacts (e.g., executables,
          packages, containers, and virtual machine images) after its build. Such
          analysis generally requires a variety of heuristics. In some contexts, this
          may also be referred to as a "3rd party" SBOM.
      build:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SbomType/build
        description: SBOM generated as part of the process of building the software
          to create a releasable artifact (e.g., executable or package) from data
          such as source files, dependencies, built components, build process ephemeral
          data, and other SBOMs.
      deployed:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SbomType/deployed
        description: SBOM provides an inventory of software that is present on a system.
          This may be an assembly of other SBOMs that combines analysis of configuration
          options, and examination of execution behavior in a (potentially simulated)
          deployment environment.
      design:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SbomType/design
        description: SBOM of intended, planned software project or product with included
          components (some of which may not yet exist) for a new software artifact.
      runtime:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SbomType/runtime
        description: SBOM generated through instrumenting the system running the software,
          to capture only components present in the system, as well as external call-outs
          or dynamically loaded components. In some contexts, this may also be referred
          to as an "Instrumented" or "Dynamic" SBOM.
      source:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SbomType/source
        description: SBOM created directly from the development environment, source
          files, and included dependencies used to build an product artifact.
    description: 'Provides a set of values to be used to describe the common types
      of SBOMs that

      tools may create.'
  SoftwarePurpose:
    enum_uri: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose
    permissible_values:
      application:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/application
        description: The Element is a software application.
      archive:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/archive
        description: The Element is an archived collection of one or more files (.tar,
          .zip, etc.).
      bom:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/bom
        description: The Element is a bill of materials.
      configuration:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/configuration
        description: The Element is configuration data.
      container:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/container
        description: The Element is a container image which can be used by a container
          runtime application.
      data:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/data
        description: The Element is data.
      device:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/device
        description: The Element refers to a chipset, processor, or electronic board.
      deviceDriver:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/deviceDriver
        description: The Element represents software that controls hardware devices.
      diskImage:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/diskImage
        description: The Element refers to a disk image that can be written to a disk,
          booted in a VM, etc. A disk image typically contains most or all of the
          components necessary to boot, such as bootloaders, kernels, firmware, userspace,
          etc.
      documentation:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/documentation
        description: The Element is documentation.
      evidence:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/evidence
        description: The Element is the evidence that a specification or requirement
          has been fulfilled.
      executable:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/executable
        description: The Element is an Artifact that can be run on a computer.
      file:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/file
        description: The Element is a single file which can be independently distributed
          (configuration file, statically linked binary, Kubernetes deployment, etc.).
      filesystemImage:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/filesystemImage
        description: The Element is a file system image that can be written to a disk
          (or virtual) partition.
      firmware:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/firmware
        description: The Element provides low level control over a device's hardware.
      framework:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/framework
        description: The Element is a software framework.
      install:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/install
        description: The Element is used to install software on disk.
      library:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/library
        description: The Element is a software library.
      manifest:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/manifest
        description: The Element is a software manifest.
      model:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/model
        description: The Element is a machine learning or artificial intelligence
          model.
      module:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/module
        description: The Element is a module of a piece of software.
      operatingSystem:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/operatingSystem
        description: The Element is an operating system.
      other:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/other
        description: The Element doesn't fit into any of the other categories.
      patch:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/patch
        description: The Element contains a set of changes to update, fix, or improve
          another Element.
      platform:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/platform
        description: The Element represents a runtime environment.
      requirement:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/requirement
        description: The Element provides a requirement needed as input for another
          Element.
      source:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/source
        description: The Element is a single or a collection of source files.
      specification:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/specification
        description: The Element is a plan, guideline or strategy how to create, perform
          or analyze an application.
      test:
        meaning: https://spdx.org/rdf/3.0.1/terms/Software/SoftwarePurpose/test
        description: The Element is a test used to verify functionality on an software
          element.
    description: Provides information about the primary purpose of an Element.
    notes:
    - 'Open/extensible enum: slots using this type allow any string via any_of.'
classes:
  AIPackage:
    class_uri: https://spdx.org/rdf/3.0.1/terms/AI/AIPackage
    description: Specifies an AI package and its associated information.
    is_a: Package
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - informationAboutTraining
    - modelDataPreprocessing
    - typeOfModel
    - safetyRiskAssessment
    - metricDecisionThreshold
    - useSensitivePersonalInformation
    - energyConsumption
    - limitation
    - hyperparameter
    - autonomyType
    - domain
    - modelExplainability
    - informationAboutApplication
    - metric
    - standardCompliance
    slot_usage:
      informationAboutTraining:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      modelDataPreprocessing:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      typeOfModel:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      safetyRiskAssessment:
        range: SafetyRiskAssessmentType
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [ai:SafetyRiskAssessmentType/serious, ai:SafetyRiskAssessmentType/high,
          ai:SafetyRiskAssessmentType/medium, ai:SafetyRiskAssessmentType/low]'
      metricDecisionThreshold:
        range: DictionaryEntry
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      useSensitivePersonalInformation:
        range: PresenceType
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [core:PresenceType/yes, core:PresenceType/no, core:PresenceType/noAssertion]'
      energyConsumption:
        range: EnergyConsumption
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      limitation:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      hyperparameter:
        range: DictionaryEntry
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      autonomyType:
        range: PresenceType
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [core:PresenceType/yes, core:PresenceType/no, core:PresenceType/noAssertion]'
      domain:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      modelExplainability:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      informationAboutApplication:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      metric:
        range: DictionaryEntry
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      standardCompliance:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
  EnergyConsumption:
    class_uri: https://spdx.org/rdf/3.0.1/terms/AI/EnergyConsumption
    description: 'A class for describing the energy consumption incurred by an AI
      model in

      different stages of its lifecycle.'
    annotations:
      shacl_node_kind:
        value: sh:BlankNodeOrIRI
    slots:
    - finetuningEnergyConsumption
    - inferenceEnergyConsumption
    - trainingEnergyConsumption
    slot_usage:
      finetuningEnergyConsumption:
        range: EnergyConsumptionDescription
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      inferenceEnergyConsumption:
        range: EnergyConsumptionDescription
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      trainingEnergyConsumption:
        range: EnergyConsumptionDescription
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
  EnergyConsumptionDescription:
    class_uri: https://spdx.org/rdf/3.0.1/terms/AI/EnergyConsumptionDescription
    description: 'The class that helps note down the quantity of energy consumption
      and the unit

      used for measurement.'
    annotations:
      shacl_node_kind:
        value: sh:BlankNodeOrIRI
    slots:
    - energyQuantity
    - energyUnit
    slot_usage:
      energyQuantity:
        range: decimal
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      energyUnit:
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [ai:EnergyUnitType/kilowattHour, ai:EnergyUnitType/megajoule,
          ai:EnergyUnitType/other]'
  Build:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Build/Build
    description: Class that describes a build instance of software/artifacts.
    is_a: Element
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - buildType
    - buildEndTime
    - buildId
    - configSourceDigest
    - buildStartTime
    - configSourceUri
    - parameter
    - configSourceEntrypoint
    - environment
    slot_usage:
      buildType:
        range: uri
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      buildEndTime:
        range: datetime
        multivalued: false
        pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
        notes:
        - 'SHACL nodeKind: sh:Literal'
      buildId:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      configSourceDigest:
        range: Hash
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      buildStartTime:
        range: datetime
        multivalued: false
        pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
        notes:
        - 'SHACL nodeKind: sh:Literal'
      configSourceUri:
        range: uri
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      parameter:
        range: DictionaryEntry
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      configSourceEntrypoint:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      environment:
        range: DictionaryEntry
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
  Agent:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Core/Agent
    description: Agent represents anything with the potential to act on a system.
    is_a: Element
    abstract: true
    annotations:
      shacl_node_kind:
        value: sh:IRI
  Annotation:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Core/Annotation
    description: An assertion made in relation to one or more elements.
    is_a: Element
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - contentType
    - statement
    - subject
    - annotationType
    slot_usage:
      contentType:
        range: string
        multivalued: false
        pattern: ^[^\/]+\/[^\/]+$
        notes:
        - 'SHACL nodeKind: sh:Literal'
      statement:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      subject:
        range: Element
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
      annotationType:
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [core:AnnotationType/other, core:AnnotationType/review]'
  Artifact:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Core/Artifact
    description: A distinct article or unit within the digital domain.
    is_a: Element
    abstract: true
    annotations:
      shacl_node_kind:
        value: sh:IRI
      shacl_message:
        value: https://spdx.org/rdf/3.0.1/terms/Core/Artifact is an abstract class
          and should not be instantiated directly. Instantiate a subclass instead.
      shacl_not:
        value: '{ sh:hasValue core:Artifact }'
    slots:
    - standardName
    - builtTime
    - validUntilTime
    - supportLevel
    - suppliedBy
    - originatedBy
    - releaseTime
    slot_usage:
      standardName:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      builtTime:
        range: datetime
        multivalued: false
        pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
        notes:
        - 'SHACL nodeKind: sh:Literal'
      validUntilTime:
        range: datetime
        multivalued: false
        pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
        notes:
        - 'SHACL nodeKind: sh:Literal'
      supportLevel:
        range: SupportType
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [core:SupportType/development, core:SupportType/support, core:SupportType/deployed,
          core:SupportType/limitedSupport, core:SupportType/endOfSupport, core:SupportType/noSupport,
          core:SupportType/noAssertion]'
      suppliedBy:
        range: Agent
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
      originatedBy:
        range: Agent
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:IRI'
      releaseTime:
        range: datetime
        multivalued: false
        pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
        notes:
        - 'SHACL nodeKind: sh:Literal'
  Bom:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Core/Bom
    description: 'A container for a grouping of SPDX-3.0 content characterizing details

      (provenence, composition, licensing, etc.) about a product.'
    is_a: Bundle
    abstract: true
    annotations:
      shacl_node_kind:
        value: sh:IRI
  Bundle:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Core/Bundle
    description: A collection of Elements that have a shared context.
    is_a: ElementCollection
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - context
    slot_usage:
      context:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
  CreationInfo:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Core/CreationInfo
    description: Provides information about the creation of the Element.
    annotations:
      shacl_node_kind:
        value: sh:BlankNodeOrIRI
    slots:
    - createdBy
    - createdUsing
    - created
    - specVersion
    - comment
    slot_usage:
      createdBy:
        range: Agent
        required: true
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:IRI'
      createdUsing:
        range: Tool
        multivalued: true
