  ContentIdentifier:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Software/ContentIdentifier
    description: A canonical, unique, immutable identifier
    is_a: IntegrityMethod
    annotations:
      shacl_node_kind:
        value: sh:BlankNodeOrIRI
    slots:
    - contentIdentifierValue
    - contentIdentifierType
    slot_usage:
      contentIdentifierValue:
        range: uri
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      contentIdentifierType:
        range: ContentIdentifierType
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [software:ContentIdentifierType/gitoid, software:ContentIdentifierType/swhid]'
  File:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Software/File
    description: Refers to any object that stores content on a computer.
    is_a: SoftwareArtifact
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - fileKind
    - contentType
    slot_usage:
      fileKind:
        range: FileKindType
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [software:FileKindType/file, software:FileKindType/directory]'
      contentType:
        range: string
        multivalued: false
        pattern: ^[^\/]+\/[^\/]+$
        notes:
        - 'SHACL nodeKind: sh:Literal'
  Package:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Software/Package
    description: 'Refers to any unit of content that can be associated with a distribution
      of

      software.'
    is_a: SoftwareArtifact
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - sourceInfo
    - homePage
    - downloadLocation
    - packageVersion
    - packageUrl
    slot_usage:
      sourceInfo:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      homePage:
        range: uri
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      downloadLocation:
        range: uri
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      packageVersion:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
      packageUrl:
        range: uri
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
  Sbom:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Software/Sbom
    description: A collection of SPDX Elements describing a single package.
    is_a: Bom
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - sbomType
    slot_usage:
      sbomType:
        range: SbomType
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [software:SbomType/design, software:SbomType/source, software:SbomType/build,
          software:SbomType/deployed, software:SbomType/runtime, software:SbomType/analyzed]'
  Snippet:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Software/Snippet
    description: Describes a certain part of a file.
    is_a: SoftwareArtifact
    annotations:
      shacl_node_kind:
        value: sh:IRI
    slots:
    - lineRange
    - snippetFromFile
    - byteRange
    slot_usage:
      lineRange:
        range: PositiveIntegerRange
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      snippetFromFile:
        range: File
        required: true
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
      byteRange:
        range: PositiveIntegerRange
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
  SoftwareArtifact:
    class_uri: https://spdx.org/rdf/3.0.1/terms/Software/SoftwareArtifact
    description: A distinct article or unit related to Software.
    is_a: Artifact
    abstract: true
    annotations:
      shacl_node_kind:
        value: sh:IRI
      shacl_message:
        value: https://spdx.org/rdf/3.0.1/terms/Software/SoftwareArtifact is an abstract
          class and should not be instantiated directly. Instantiate a subclass instead.
      shacl_not:
        value: '{ sh:hasValue software:SoftwareArtifact }'
    slots:
    - attributionText
    - primaryPurpose
    - additionalPurpose
    - contentIdentifier
    - copyrightText
    slot_usage:
      attributionText:
        range: string
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:Literal'
      primaryPurpose:
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [software:SoftwarePurpose/application, software:SoftwarePurpose/archive,
          software:SoftwarePurpose/bom, software:SoftwarePurpose/configuration, software:SoftwarePurpose/container,
          software:SoftwarePurpose/data, software:SoftwarePurpose/device, software:SoftwarePurpose/diskImage,
          software:SoftwarePurpose/deviceDriver, software:SoftwarePurpose/documentation,
          software:SoftwarePurpose/evidence, software:SoftwarePurpose/executable,
          software:SoftwarePurpose/file, software:SoftwarePurpose/filesystemImage,
          software:SoftwarePurpose/firmware, software:SoftwarePurpose/framework, software:SoftwarePurpose/install,
          software:SoftwarePurpose/library, software:SoftwarePurpose/manifest, software:SoftwarePurpose/model,
          software:SoftwarePurpose/module, software:SoftwarePurpose/operatingSystem,
          software:SoftwarePurpose/other, software:SoftwarePurpose/patch, software:SoftwarePurpose/platform,
          software:SoftwarePurpose/requirement, software:SoftwarePurpose/source, software:SoftwarePurpose/specification,
          software:SoftwarePurpose/test]'
      additionalPurpose:
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [software:SoftwarePurpose/application, software:SoftwarePurpose/archive,
          software:SoftwarePurpose/bom, software:SoftwarePurpose/configuration, software:SoftwarePurpose/container,
          software:SoftwarePurpose/data, software:SoftwarePurpose/device, software:SoftwarePurpose/diskImage,
          software:SoftwarePurpose/deviceDriver, software:SoftwarePurpose/documentation,
          software:SoftwarePurpose/evidence, software:SoftwarePurpose/executable,
          software:SoftwarePurpose/file, software:SoftwarePurpose/filesystemImage,
          software:SoftwarePurpose/firmware, software:SoftwarePurpose/framework, software:SoftwarePurpose/install,
          software:SoftwarePurpose/library, software:SoftwarePurpose/manifest, software:SoftwarePurpose/model,
          software:SoftwarePurpose/module, software:SoftwarePurpose/operatingSystem,
          software:SoftwarePurpose/other, software:SoftwarePurpose/patch, software:SoftwarePurpose/platform,
          software:SoftwarePurpose/requirement, software:SoftwarePurpose/source, software:SoftwarePurpose/specification,
          software:SoftwarePurpose/test]'
      contentIdentifier:
        range: ContentIdentifier
        multivalued: true
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
      copyrightText:
        range: string
        multivalued: false
        notes:
        - 'SHACL nodeKind: sh:Literal'
slots:
  autonomyType:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/autonomyType
    description: 'Indicates whether the system can perform a decision or action without
      human

      involvement or guidance.'
    range: PresenceType
  domain:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/domain
    description: Captures the domain in which the AI package can be used.
    range: string
  energyConsumption:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/energyConsumption
    description: Indicates the amount of energy consumption incurred by an AI model.
    range: EnergyConsumption
  energyQuantity:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/energyQuantity
    description: Represents the energy quantity.
    range: decimal
  energyUnit:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/energyUnit
