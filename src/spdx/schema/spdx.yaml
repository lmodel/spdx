---
id: https://w3id.org/lmodel/spdx
name: spdx
title: System Package Data Exchange (SPDX)
description: >-
  A LinkML rendering of the SPDX 3.0.1 model: its nine profiles, each a module, with every class, property
  and vocabulary keeping its SPDX IRI.
version: 3.0.1
source: https://spdx.org/rdf/3.0.1/spdx-model.ttl
license: Apache-2.0
see_also:
  - https://lmodel.github.io/spdx
  - https://spdx.github.io/spdx-spec/v3.0.1/
  - https://spdx.dev/specifications/
comments:
  - >-
    scripts/spdx_to_linkml.py writes every YAML file in this folder from the vendored model, upstream/spdx-model.ttl.
    Change the script or the model, never the files.
  - >-
    spdx_core imports only the LinkML types, each profile module imports the modules it references, and
    this file adds nothing of its own, so an importer can take one profile.
  - >-
    The element descriptions are the model's own rdfs:comment texts, which the SPDX Project publishes
    under the Community Specification License 1.0.
  - >-
    The model's individuals (NoAssertionElement, NoneElement, NoAssertionLicense, NoneLicense and SpdxOrganization)
    are instance data, not schema. A reference to one is an IRI like any other Element reference.

prefixes:
  spdx_linkml: https://w3id.org/lmodel/spdx/
  spdx: https://spdx.org/rdf/3.0.1/terms/
  spdx_core: https://spdx.org/rdf/3.0.1/terms/Core/
  spdx_software: https://spdx.org/rdf/3.0.1/terms/Software/
  spdx_security: https://spdx.org/rdf/3.0.1/terms/Security/
  spdx_simple_licensing: https://spdx.org/rdf/3.0.1/terms/SimpleLicensing/
  spdx_expanded_licensing: https://spdx.org/rdf/3.0.1/terms/ExpandedLicensing/
  spdx_ai: https://spdx.org/rdf/3.0.1/terms/AI/
  spdx_dataset: https://spdx.org/rdf/3.0.1/terms/Dataset/
  spdx_build: https://spdx.org/rdf/3.0.1/terms/Build/
  spdx_extension: https://spdx.org/rdf/3.0.1/terms/Extension/
  linkml: https://w3id.org/linkml/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: spdx_linkml
default_range: string

imports:
  - linkml:types
  - ./spdx_core
  - ./spdx_build
  - ./spdx_extension
  - ./spdx_simple_licensing
  - ./spdx_software
  - ./spdx_ai
  - ./spdx_dataset
  - ./spdx_expanded_licensing
  - ./spdx_security
