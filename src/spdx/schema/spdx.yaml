    - range: AnnotationType
    - range: string
  beginIntegerRange:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/Core/beginIntegerRange
    description: Defines the beginning of a range.
    range: integer
    minimum_value: 1
  builtTime:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/Core/builtTime
