    any_of:
    - range: EnergyUnitType
    - range: string
  finetuningEnergyConsumption:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/finetuningEnergyConsumption
    description: 'Specifies the amount of energy consumed when finetuning the AI model
      that is

      being used in the AI system.'
    range: EnergyConsumptionDescription
  hyperparameter:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/hyperparameter
    description: 'Records a hyperparameter used to build the AI model contained in
      the AI

      package.'
    range: DictionaryEntry
  inferenceEnergyConsumption:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/inferenceEnergyConsumption
    description: 'Specifies the amount of energy consumed during inference time by
      an AI model

      that is being used in the AI system.'
    range: EnergyConsumptionDescription
  informationAboutApplication:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/informationAboutApplication
    description: 'Provides relevant information about the AI software, not including
      the model

      description.'
    range: string
  informationAboutTraining:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/informationAboutTraining
    description: Describes relevant information about different steps of the training
      process.
    range: string
  limitation:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/limitation
    description: Captures a limitation of the AI software.
    range: string
  metric:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/metric
    description: Records the measurement of prediction quality of the AI model.
    range: DictionaryEntry
  metricDecisionThreshold:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/metricDecisionThreshold
    description: 'Captures the threshold that was used for computation of a metric
      described in

      the metric field.'
    range: DictionaryEntry
  modelDataPreprocessing:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/modelDataPreprocessing
    description: 'Describes all the preprocessing steps applied to the training data
      before the

      model training.'
    range: string
  modelExplainability:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/modelExplainability
    description: Describes methods that can be used to explain the results from the
      AI model.
    range: string
  safetyRiskAssessment:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/safetyRiskAssessment
    description: Records the results of general safety risk assessment of the AI system.
    range: SafetyRiskAssessmentType
  standardCompliance:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/standardCompliance
    description: Captures a standard that is being complied with.
    range: string
  trainingEnergyConsumption:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/trainingEnergyConsumption
    description: 'Specifies the amount of energy consumed when training the AI model
      that is

      being used in the AI system.'
    range: EnergyConsumptionDescription
  typeOfModel:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/typeOfModel
    description: Records the type of the model used in the AI software.
    range: string
  useSensitivePersonalInformation:
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/useSensitivePersonalInformation
    description: 'Records if sensitive personal information is used during model training
