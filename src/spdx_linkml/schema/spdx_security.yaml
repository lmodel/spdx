---
id: https://w3id.org/lmodel/spdx/spdx_security
name: spdx_security
title: SPDX Security profile
description: >-
  The Security profile: vulnerabilities and the assessment relationships that score them, with CVSS, EPSS,
  SSVC, exploit catalogues and VEX statements.
version: 3.0.1
source: https://spdx.org/rdf/3.0.1/spdx-model.ttl
license: Apache-2.0
see_also:
  - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Security/

prefixes:
  spdx_linkml: https://w3id.org/lmodel/spdx/
  spdx: https://spdx.org/rdf/3.0.1/terms/
  spdx_core: https://spdx.org/rdf/3.0.1/terms/Core/
  spdx_software: https://spdx.org/rdf/3.0.1/terms/Software/
  spdx_security: https://spdx.org/rdf/3.0.1/terms/Security/
  spdx_simple_licensing: https://spdx.org/rdf/3.0.1/terms/SimpleLicensing/
  spdx_expanded_licensing: https://spdx.org/rdf/3.0.1/terms/ExpandedLicensing/
  spdx_ai: https://spdx.org/rdf/3.0.1/terms/AI/
  spdx_dataset: https://spdx.org/rdf/3.0.1/terms/Dataset/
  spdx_build: https://spdx.org/rdf/3.0.1/terms/Build/
  spdx_extension: https://spdx.org/rdf/3.0.1/terms/Extension/
  linkml: https://w3id.org/linkml/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: spdx_linkml
default_range: string

imports:
  - linkml:types
  - ./spdx_core
  - ./spdx_software

enums:

  CvssSeverityType:
    enum_uri: spdx_security:CvssSeverityType
    description: Specifies the CVSS base, temporal, threat, or environmental severity type.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/CvssSeverityType/
    in_subset:
      - spdx_security
    permissible_values:
      critical:
        description: When a CVSS score is between 9.0 - 10.0
        meaning: spdx_security:CvssSeverityType/critical
      high:
        description: When a CVSS score is between 7.0 - 8.9
        meaning: spdx_security:CvssSeverityType/high
      low:
        description: When a CVSS score is between 0.1 - 3.9
        meaning: spdx_security:CvssSeverityType/low
      medium:
        description: When a CVSS score is between 4.0 - 6.9
        meaning: spdx_security:CvssSeverityType/medium
      none:
        description: When a CVSS score is 0.0
        meaning: spdx_security:CvssSeverityType/none

  ExploitCatalogType:
    enum_uri: spdx_security:ExploitCatalogType
    description: Specifies the exploit catalog type.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/ExploitCatalogType/
    in_subset:
      - spdx_security
    permissible_values:
      kev:
        description: CISA's Known Exploited Vulnerability (KEV) Catalog
        meaning: spdx_security:ExploitCatalogType/kev
      other:
        description: Other exploit catalogs
        meaning: spdx_security:ExploitCatalogType/other

  SsvcDecisionType:
    enum_uri: spdx_security:SsvcDecisionType
    description: Specifies the SSVC decision type.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/SsvcDecisionType/
    in_subset:
      - spdx_security
    permissible_values:
      act:
        description: >-
          The vulnerability requires attention from the organization's internal, supervisory-level and
          leadership-level individuals. Necessary actions include requesting assistance or information
          about the vulnerability, as well as publishing a notification either internally and/or externally.
          Typically, internal groups would meet to determine the overall response and then execute agreed
          upon actions. CISA recommends remediating Act vulnerabilities as soon as possible.
        meaning: spdx_security:SsvcDecisionType/act
      attend:
        description: >-
          The vulnerability requires attention from the organization's internal, supervisory-level individuals.
          Necessary actions include requesting assistance or information about the vulnerability, and
          may involve publishing a notification either internally and/or externally. CISA recommends remediating
          Attend vulnerabilities sooner than standard update timelines.
        meaning: spdx_security:SsvcDecisionType/attend
      track:
        description: >-
          The vulnerability does not require action at this time. The organization would continue to track
          the vulnerability and reassess it if new information becomes available. CISA recommends remediating
          Track vulnerabilities within standard update timelines.
        meaning: spdx_security:SsvcDecisionType/track
      trackStar:
        description: >-
          ("Track*" in the SSVC spec) The vulnerability contains specific characteristics that may require
          closer monitoring for changes. CISA recommends remediating Track* vulnerabilities within standard
          update timelines.
        meaning: spdx_security:SsvcDecisionType/trackStar

  VexJustificationType:
    enum_uri: spdx_security:VexJustificationType
    description: Specifies the VEX justification type.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/VexJustificationType/
    in_subset:
      - spdx_security
    permissible_values:
      componentNotPresent:
        description: >-
          The software is not affected because the vulnerable component is not in the product.
        meaning: spdx_security:VexJustificationType/componentNotPresent
      inlineMitigationsAlreadyExist:
        description: >-
          Built-in inline controls or mitigations prevent an adversary from leveraging the vulnerability.
        meaning: spdx_security:VexJustificationType/inlineMitigationsAlreadyExist
      vulnerableCodeCannotBeControlledByAdversary:
        description: >-
          The vulnerable component is present, and the component contains the vulnerable code. However,
          vulnerable code is used in such a way that an attacker cannot mount any anticipated attack.
        meaning: spdx_security:VexJustificationType/vulnerableCodeCannotBeControlledByAdversary
      vulnerableCodeNotInExecutePath:
        description: >-
          The affected code is not reachable through the execution of the code, including non-anticipated
          states of the product.
        meaning: spdx_security:VexJustificationType/vulnerableCodeNotInExecutePath
      vulnerableCodeNotPresent:
        description: >-
          The product is not affected because the code underlying the vulnerability is not present in
          the product.
        meaning: spdx_security:VexJustificationType/vulnerableCodeNotPresent

slots:

  actionStatement:
    description: >-
      Provides advise on how to mitigate or remediate a vulnerability when a VEX product is affected by
      it.
    slot_uri: spdx_security:actionStatement
    range: string
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/actionStatement/
    in_subset:
      - spdx_security

  actionStatementTime:
    description: >-
      Records the time when a recommended action was communicated in a VEX statement to mitigate a vulnerability.
    slot_uri: spdx_security:actionStatementTime
    range: date_time_stamp
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/actionStatementTime/
    in_subset:
      - spdx_security

  assessedElement:
    description: >-
      Specifies an Element contained in a piece of software where a vulnerability was found.
    slot_uri: spdx_security:assessedElement
    range: SoftwareArtifact
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/assessedElement/
    in_subset:
      - spdx_security

  catalogType:
    description: Specifies the exploit catalog type.
    slot_uri: spdx_security:catalogType
    range: ExploitCatalogType
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/catalogType/
    in_subset:
      - spdx_security

  decisionType:
    description: >-
      Provide the enumeration of possible decisions in the [Stakeholder-Specific Vulnerability Categorization
      (SSVC) decision tree](https://www.cisa.gov/stakeholder-specific-vulnerability-categorization-ssvc).
    slot_uri: spdx_security:decisionType
    range: SsvcDecisionType
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/decisionType/
    in_subset:
      - spdx_security

  exploited:
    description: >-
      Describe that a CVE is known to have an exploit because it's been listed in an exploit catalog.
    slot_uri: spdx_security:exploited
    range: boolean
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/exploited/
    in_subset:
      - spdx_security

  impactStatement:
    description: >-
      Explains why a VEX product is not affected by a vulnerability. It is an alternative in VexNotAffectedVulnAssessmentRelationship
      to the machine-readable justification label.
    slot_uri: spdx_security:impactStatement
    range: string
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/impactStatement/
    in_subset:
      - spdx_security

  impactStatementTime:
    description: Timestamp of impact statement.
    slot_uri: spdx_security:impactStatementTime
    range: date_time_stamp
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/impactStatementTime/
    in_subset:
      - spdx_security

  justificationType:
    description: >-
      Impact justification label to be used when linking a vulnerability to an element representing a
      VEX product with a VexNotAffectedVulnAssessmentRelationship relationship.
    slot_uri: spdx_security:justificationType
    range: VexJustificationType
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/justificationType/
    in_subset:
      - spdx_security

  modifiedTime:
    description: Specifies a time when a vulnerability assessment was modified
    slot_uri: spdx_security:modifiedTime
    range: date_time_stamp
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/modifiedTime/
    in_subset:
      - spdx_security

  percentile:
    description: The percentile of the current probability score.
    slot_uri: spdx_security:percentile
    range: decimal
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/percentile/
    in_subset:
      - spdx_security

  probability:
    description: A probability score between 0 and 1 of a vulnerability being exploited.
    slot_uri: spdx_security:probability
    range: decimal
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/probability/
    in_subset:
      - spdx_security

  publishedTime:
    description: Specifies the time when a vulnerability was published.
    slot_uri: spdx_security:publishedTime
    range: date_time_stamp
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/publishedTime/
    in_subset:
      - spdx_security

  score:
    description: Provides a numerical (0-10) representation of the severity of a vulnerability.
    slot_uri: spdx_security:score
    range: decimal
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/score/
    in_subset:
      - spdx_security

  security_locator:
    description: Provides the location of an exploit catalog.
    slot_uri: spdx_security:locator
    range: uri
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/locator/
    in_subset:
      - spdx_security

  severity:
    description: >-
      Specifies the CVSS qualitative severity rating of a vulnerability in relation to a piece of software.
    slot_uri: spdx_security:severity
    range: CvssSeverityType
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/severity/
    in_subset:
      - spdx_security

  statusNotes:
    description: Conveys information about how VEX status was determined.
    slot_uri: spdx_security:statusNotes
    range: string
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/statusNotes/
    in_subset:
      - spdx_security

  vectorString:
    description: Specifies the CVSS vector string for a vulnerability.
    slot_uri: spdx_security:vectorString
    range: string
    required: true
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/vectorString/
    in_subset:
      - spdx_security

  vexVersion:
    description: Specifies the version of a VEX statement.
    slot_uri: spdx_security:vexVersion
    range: string
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/vexVersion/
    in_subset:
      - spdx_security

  withdrawnTime:
    description: Specified the time and date when a vulnerability was withdrawn.
    slot_uri: spdx_security:withdrawnTime
    range: date_time_stamp
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Properties/withdrawnTime/
    in_subset:
      - spdx_security

classes:

  CvssV2VulnAssessmentRelationship:
    is_a: VulnAssessmentRelationship
    class_uri: spdx_security:CvssV2VulnAssessmentRelationship
    description: Provides a CVSS version 2.0 assessment for a vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/CvssV2VulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - score
      - vectorString

  CvssV3VulnAssessmentRelationship:
    is_a: VulnAssessmentRelationship
    class_uri: spdx_security:CvssV3VulnAssessmentRelationship
    description: Provides a CVSS version 3 assessment for a vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/CvssV3VulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - score
      - severity
      - vectorString

  CvssV4VulnAssessmentRelationship:
    is_a: VulnAssessmentRelationship
    class_uri: spdx_security:CvssV4VulnAssessmentRelationship
    description: Provides a CVSS version 4 assessment for a vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/CvssV4VulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - score
      - severity
      - vectorString

  EpssVulnAssessmentRelationship:
    is_a: VulnAssessmentRelationship
    class_uri: spdx_security:EpssVulnAssessmentRelationship
    description: Provides an EPSS assessment for a vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/EpssVulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - percentile
      - probability

  ExploitCatalogVulnAssessmentRelationship:
    is_a: VulnAssessmentRelationship
    class_uri: spdx_security:ExploitCatalogVulnAssessmentRelationship
    description: Provides an exploit assessment of a vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/ExploitCatalogVulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - catalogType
      - exploited
      - security_locator

  SsvcVulnAssessmentRelationship:
    is_a: VulnAssessmentRelationship
    class_uri: spdx_security:SsvcVulnAssessmentRelationship
    description: Provides an SSVC assessment for a vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/SsvcVulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - decisionType

  VexAffectedVulnAssessmentRelationship:
    is_a: VexVulnAssessmentRelationship
    class_uri: spdx_security:VexAffectedVulnAssessmentRelationship
    description: >-
      Connects a vulnerability and an element designating the element as a product affected by the vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/VexAffectedVulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - actionStatement
      - actionStatementTime

  VexFixedVulnAssessmentRelationship:
    is_a: VexVulnAssessmentRelationship
    class_uri: spdx_security:VexFixedVulnAssessmentRelationship
    description: >-
      Links a vulnerability and elements representing products (in the VEX sense) where a fix has been
      applied and are no longer affected.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/VexFixedVulnAssessmentRelationship/
    in_subset:
      - spdx_security

  VexNotAffectedVulnAssessmentRelationship:
    is_a: VexVulnAssessmentRelationship
    class_uri: spdx_security:VexNotAffectedVulnAssessmentRelationship
    description: >-
      Links a vulnerability and one or more elements designating the latter as products not affected by
      the vulnerability.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/VexNotAffectedVulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - impactStatement
      - impactStatementTime
      - justificationType

  VexUnderInvestigationVulnAssessmentRelationship:
    is_a: VexVulnAssessmentRelationship
    class_uri: spdx_security:VexUnderInvestigationVulnAssessmentRelationship
    description: >-
      Designates elements as products where the impact of a vulnerability is being investigated.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/VexUnderInvestigationVulnAssessmentRelationship/
    in_subset:
      - spdx_security

  VexVulnAssessmentRelationship:
    is_a: VulnAssessmentRelationship
    abstract: true
    class_uri: spdx_security:VexVulnAssessmentRelationship
    description: Abstract ancestor class for all VEX relationships
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/VexVulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - statusNotes
      - vexVersion

  VulnAssessmentRelationship:
    is_a: Relationship
    abstract: true
    class_uri: spdx_security:VulnAssessmentRelationship
    description: Abstract ancestor class for all vulnerability assessments
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/VulnAssessmentRelationship/
    in_subset:
      - spdx_security
    slots:
      - assessedElement
      - modifiedTime
      - publishedTime
      - suppliedBy
      - withdrawnTime

  Vulnerability:
    is_a: Artifact
    class_uri: spdx_security:Vulnerability
    description: Specifies a vulnerability and its associated information.
    see_also:
      - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Classes/Vulnerability/
    in_subset:
      - spdx_security
    slots:
      - modifiedTime
      - publishedTime
      - withdrawnTime
