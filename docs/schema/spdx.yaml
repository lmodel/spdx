name: spdx
description: 'A LinkML rendering of the SPDX 3.0.1 model: its nine profiles, each
  a module, with every class, property and vocabulary keeping its SPDX IRI.'
title: System Package Data Exchange (SPDX)
comments:
- scripts/spdx_to_linkml.py writes every YAML file in this folder from the vendored
  model, upstream/spdx-model.ttl. Change the script or the model, never the files.
- spdx_core imports only the LinkML types, each profile module imports the modules
  it references, and this file adds nothing of its own, so an importer can take one
  profile.
- The element descriptions are the model's own rdfs:comment texts, which the SPDX
  Project publishes under the Community Specification License 1.0.
- The model's individuals (NoAssertionElement, NoneElement, NoAssertionLicense, NoneLicense
  and SpdxOrganization) are instance data, not schema. A reference to one is an IRI
  like any other Element reference.
source: https://spdx.org/rdf/3.0.1/spdx-model.ttl
see_also:
- https://lmodel.github.io/spdx
- https://spdx.github.io/spdx-spec/v3.0.1/
- https://spdx.dev/specifications/
id: https://w3id.org/lmodel/spdx
version: 3.0.1
imports:
- linkml:types
- ./spdx_core
- ./spdx_build
- ./spdx_extension
- ./spdx_simple_licensing
- ./spdx_software
- ./spdx_ai
- ./spdx_dataset
- ./spdx_expanded_licensing
- ./spdx_security
license: Apache-2.0
prefixes:
  spdx_linkml:
    prefix_prefix: spdx_linkml
    prefix_reference: https://w3id.org/lmodel/spdx/
  spdx:
    prefix_prefix: spdx
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/
  spdx_core:
    prefix_prefix: spdx_core
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Core/
  spdx_software:
    prefix_prefix: spdx_software
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Software/
  spdx_security:
    prefix_prefix: spdx_security
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Security/
  spdx_simple_licensing:
    prefix_prefix: spdx_simple_licensing
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/SimpleLicensing/
  spdx_expanded_licensing:
    prefix_prefix: spdx_expanded_licensing
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/ExpandedLicensing/
  spdx_ai:
    prefix_prefix: spdx_ai
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/AI/
  spdx_dataset:
    prefix_prefix: spdx_dataset
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Dataset/
  spdx_build:
    prefix_prefix: spdx_build
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Build/
  spdx_extension:
    prefix_prefix: spdx_extension
    prefix_reference: https://spdx.org/rdf/3.0.1/terms/Extension/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: spdx_linkml
default_range: string
subsets:
  spdx_core:
    name: spdx_core
    definition_uri: https://w3id.org/lmodel/spdx/SpdxCore
    description: Elements of the SPDX Core profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_software:
    name: spdx_software
    definition_uri: https://w3id.org/lmodel/spdx/SpdxSoftware
    description: Elements of the SPDX Software profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_security:
    name: spdx_security
    definition_uri: https://w3id.org/lmodel/spdx/SpdxSecurity
    description: Elements of the SPDX Security profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_simple_licensing:
    name: spdx_simple_licensing
    definition_uri: https://w3id.org/lmodel/spdx/SpdxSimpleLicensing
    description: Elements of the SPDX Simple Licensing profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_expanded_licensing:
    name: spdx_expanded_licensing
    definition_uri: https://w3id.org/lmodel/spdx/SpdxExpandedLicensing
    description: Elements of the SPDX Expanded Licensing profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_ai:
    name: spdx_ai
    definition_uri: https://w3id.org/lmodel/spdx/SpdxAi
    description: Elements of the SPDX AI profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_dataset:
    name: spdx_dataset
    definition_uri: https://w3id.org/lmodel/spdx/SpdxDataset
    description: Elements of the SPDX Dataset profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_build:
    name: spdx_build
    definition_uri: https://w3id.org/lmodel/spdx/SpdxBuild
    description: Elements of the SPDX Build profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
  spdx_extension:
    name: spdx_extension
    definition_uri: https://w3id.org/lmodel/spdx/SpdxExtension
    description: Elements of the SPDX Extension profile.
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  date_time_stamp:
    name: date_time_stamp
    definition_uri: https://w3id.org/lmodel/spdx/DateTimeStamp
    description: 'A UTC timestamp as SPDX writes one: a date, a time to the second
      and a trailing Z.'
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    typeof: string
    base: str
    uri: xsd:dateTimeStamp
    pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
  media_type:
    name: media_type
    definition_uri: https://w3id.org/lmodel/spdx/MediaType
    description: An IANA media type, such as text/plain.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[^\/]+\/[^\/]+$
  semver:
    name: semver
    definition_uri: https://w3id.org/lmodel/spdx/Semver
    description: A semantic version, such as 3.0.1.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
  positive_integer:
    name: positive_integer
    definition_uri: https://w3id.org/lmodel/spdx/PositiveInteger
    description: An integer of one or more.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    typeof: integer
    base: int
    uri: xsd:positiveInteger
    minimum_value: 1
  non_negative_integer:
    name: non_negative_integer
    definition_uri: https://w3id.org/lmodel/spdx/NonNegativeInteger
    description: An integer of zero or more.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    typeof: integer
    base: int
    uri: xsd:nonNegativeInteger
    minimum_value: 0
enums:
  AnnotationType:
    name: AnnotationType
    definition_uri: https://w3id.org/lmodel/spdx/AnnotationType
    description: Specifies the type of an annotation.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/AnnotationType/
    enum_uri: spdx_core:AnnotationType
    permissible_values:
      other:
        text: other
        description: Used to store extra information about an Element which is not
          part of a review (e.g. extra information provided during the creation of
          the Element).
        meaning: spdx_core:AnnotationType/other
      review:
        text: review
        description: Used when someone reviews the Element.
        meaning: spdx_core:AnnotationType/review
  ExternalIdentifierType:
    name: ExternalIdentifierType
    definition_uri: https://w3id.org/lmodel/spdx/ExternalIdentifierType
    description: Specifies the type of an external identifier.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/ExternalIdentifierType/
    enum_uri: spdx_core:ExternalIdentifierType
    permissible_values:
      cpe22:
        text: cpe22
        description: '[Common Platform Enumeration Specification 2.2](https://cpe.mitre.org/files/cpe-specification_2.2.pdf)'
        meaning: spdx_core:ExternalIdentifierType/cpe22
      cpe23:
        text: cpe23
        description: '[Common Platform Enumeration: Naming Specification Version 2.3](https://csrc.nist.gov/publications/detail/nistir/7695/final)'
        meaning: spdx_core:ExternalIdentifierType/cpe23
      cve:
        text: cve
        description: Common Vulnerabilities and Exposures identifiers, an identifier
          for a specific software flaw defined within the official CVE Dictionary
          and that conforms to the [CVE specification](https://csrc.nist.gov/glossary/term/cve_id).
        meaning: spdx_core:ExternalIdentifierType/cve
      email:
        text: email
        description: Email address, as defined in [RFC 3696](https://datatracker.ietf.org/doc/rfc3986/)
          Section 3.
        meaning: spdx_core:ExternalIdentifierType/email
      gitoid:
        text: gitoid
        description: '[Gitoid](https://www.iana.org/assignments/uri-schemes/prov/gitoid),
          stands for [Git Object ID](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects).
          A gitoid of type blob is a unique hash of a binary artifact. A gitoid may
          represent either an [Artifact Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-identifier-types)
          for the software artifact or an [Input Manifest Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#input-manifest-identifier)
          for the software artifact''s associated [Artifact Input Manifest](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-input-manifest);
          this ambiguity exists because the Artifact Input Manifest is itself an artifact,
          and the gitoid of that artifact is its valid identifier. Gitoids calculated
          on software artifacts (Snippet, File, or Package Elements) should be recorded
          in the SPDX 3.0 SoftwareArtifact''s contentIdentifier property. Gitoids
          calculated on the Artifact Input Manifest (Input Manifest Identifier) should
          be recorded in the SPDX 3.0 Element''s externalIdentifier property. See
          [OmniBOR Specification](https://github.com/omnibor/spec/), a minimalistic
          specification for describing software [Artifact Dependency Graphs](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-dependency-graph-adg).'
        meaning: spdx_core:ExternalIdentifierType/gitoid
      other:
        text: other
        description: Used when the type does not match any of the other options.
        meaning: spdx_core:ExternalIdentifierType/other
      packageUrl:
        text: packageUrl
        description: Package URL, as defined in the corresponding [Annex](https://spdx.github.io/spdx-spec/v3.0.1/annexes/pkg-url-specification/)
          of this specification.
        meaning: spdx_core:ExternalIdentifierType/packageUrl
      securityOther:
        text: securityOther
        description: Used when there is a security related identifier of unspecified
          type.
        meaning: spdx_core:ExternalIdentifierType/securityOther
      swhid:
        text: swhid
        description: SoftWare Hash IDentifier, a persistent intrinsic identifier for
          digital artifacts, such as files, trees (also known as directories or folders),
          commits, and other objects typically found in version control systems. The
          format of the identifiers is defined in the [SWHID specification](https://www.swhid.org/specification/v1.1/4.Syntax)
          (ISO/IEC DIS 18670). They typically look like `swh:1:cnt:94a9ed024d3859793618152ea559a168bbcbb5e2`.
        meaning: spdx_core:ExternalIdentifierType/swhid
      swid:
        text: swid
        description: Concise Software Identification (CoSWID) tag, as defined in [RFC
          9393](https://datatracker.ietf.org/doc/rfc9393/) Section 2.3.
        meaning: spdx_core:ExternalIdentifierType/swid
      urlScheme:
        text: urlScheme
        description: '[Uniform Resource Identifier (URI) Schemes](https://www.iana.org/assignments/uri-schemes/uri-schemes.xhtml).
          The scheme used in order to locate a resource.'
        meaning: spdx_core:ExternalIdentifierType/urlScheme
  ExternalRefType:
    name: ExternalRefType
    definition_uri: https://w3id.org/lmodel/spdx/ExternalRefType
    description: Specifies the type of an external reference.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/ExternalRefType/
    enum_uri: spdx_core:ExternalRefType
    permissible_values:
      altDownloadLocation:
        text: altDownloadLocation
        description: A reference to an alternative download location.
        meaning: spdx_core:ExternalRefType/altDownloadLocation
      altWebPage:
        text: altWebPage
        description: A reference to an alternative web page.
        meaning: spdx_core:ExternalRefType/altWebPage
      binaryArtifact:
        text: binaryArtifact
        description: A reference to binary artifacts related to a package.
        meaning: spdx_core:ExternalRefType/binaryArtifact
      bower:
        text: bower
        description: A reference to a Bower package. The package locator format, looks
          like `package#version`, is defined in the "install" section of [Bower API
          documentation](https://bower.io/docs/api/#install).
        meaning: spdx_core:ExternalRefType/bower
      buildMeta:
        text: buildMeta
        description: A reference build metadata related to a published package.
        meaning: spdx_core:ExternalRefType/buildMeta
      buildSystem:
        text: buildSystem
        description: A reference build system used to create or publish the package.
        meaning: spdx_core:ExternalRefType/buildSystem
      certificationReport:
        text: certificationReport
        description: A reference to a certification report for a package from an accredited/independent
          body.
        meaning: spdx_core:ExternalRefType/certificationReport
      chat:
        text: chat
        description: A reference to the instant messaging system used by the maintainer
          for a package.
        meaning: spdx_core:ExternalRefType/chat
      componentAnalysisReport:
        text: componentAnalysisReport
        description: A reference to a Software Composition Analysis (SCA) report.
        meaning: spdx_core:ExternalRefType/componentAnalysisReport
      cwe:
        text: cwe
        description: '[Common Weakness Enumeration](https://csrc.nist.gov/glossary/term/common_weakness_enumeration).
          A reference to a source of software flaw defined within the official [CWE
          List](https://cwe.mitre.org/data/) that conforms to the [CWE specification](https://cwe.mitre.org/).'
        meaning: spdx_core:ExternalRefType/cwe
      documentation:
        text: documentation
        description: A reference to the documentation for a package.
        meaning: spdx_core:ExternalRefType/documentation
      dynamicAnalysisReport:
        text: dynamicAnalysisReport
        description: A reference to a dynamic analysis report for a package.
        meaning: spdx_core:ExternalRefType/dynamicAnalysisReport
      eolNotice:
        text: eolNotice
        description: A reference to the End Of Sale (EOS) and/or End Of Life (EOL)
          information related to a package.
        meaning: spdx_core:ExternalRefType/eolNotice
      exportControlAssessment:
        text: exportControlAssessment
        description: A reference to a export control assessment for a package.
        meaning: spdx_core:ExternalRefType/exportControlAssessment
      funding:
        text: funding
        description: A reference to funding information related to a package.
        meaning: spdx_core:ExternalRefType/funding
      issueTracker:
        text: issueTracker
        description: A reference to the issue tracker for a package.
        meaning: spdx_core:ExternalRefType/issueTracker
      license:
        text: license
        description: A reference to additional license information related to an artifact.
        meaning: spdx_core:ExternalRefType/license
      mailingList:
        text: mailingList
        description: A reference to the mailing list used by the maintainer for a
          package.
        meaning: spdx_core:ExternalRefType/mailingList
      mavenCentral:
        text: mavenCentral
        description: A reference to a Maven repository artifact. The artifact locator
          format is defined in the [Maven documentation](https://maven.apache.org/guides/mini/guide-naming-conventions.html)
          and looks like `groupId:artifactId[:version]`.
        meaning: spdx_core:ExternalRefType/mavenCentral
      metrics:
        text: metrics
        description: A reference to metrics related to package such as OpenSSF scorecards.
        meaning: spdx_core:ExternalRefType/metrics
      npm:
        text: npm
        description: A reference to an npm package. The package locator format is
          defined in the [npm documentation](https://docs.npmjs.com/cli/v10/configuring-npm/package-json)
          and looks like `package@version`.
        meaning: spdx_core:ExternalRefType/npm
      nuget:
        text: nuget
        description: A reference to a NuGet package. The package locator format is
          defined in the [NuGet documentation](https://docs.nuget.org) and looks like
          `package/version`.
        meaning: spdx_core:ExternalRefType/nuget
      other:
        text: other
        description: Used when the type does not match any of the other options.
        meaning: spdx_core:ExternalRefType/other
      privacyAssessment:
        text: privacyAssessment
        description: A reference to a privacy assessment for a package.
        meaning: spdx_core:ExternalRefType/privacyAssessment
      productMetadata:
        text: productMetadata
        description: A reference to additional product metadata such as reference
          within organization's product catalog.
        meaning: spdx_core:ExternalRefType/productMetadata
      purchaseOrder:
        text: purchaseOrder
        description: A reference to a purchase order for a package.
        meaning: spdx_core:ExternalRefType/purchaseOrder
      qualityAssessmentReport:
        text: qualityAssessmentReport
        description: A reference to a quality assessment for a package.
        meaning: spdx_core:ExternalRefType/qualityAssessmentReport
      releaseHistory:
        text: releaseHistory
        description: A reference to a published list of releases for a package.
        meaning: spdx_core:ExternalRefType/releaseHistory
      releaseNotes:
        text: releaseNotes
        description: A reference to the release notes for a package.
        meaning: spdx_core:ExternalRefType/releaseNotes
      riskAssessment:
        text: riskAssessment
        description: A reference to a risk assessment for a package.
        meaning: spdx_core:ExternalRefType/riskAssessment
      runtimeAnalysisReport:
        text: runtimeAnalysisReport
        description: A reference to a runtime analysis report for a package.
        meaning: spdx_core:ExternalRefType/runtimeAnalysisReport
      secureSoftwareAttestation:
        text: secureSoftwareAttestation
        description: A reference to information assuring that the software is developed
          using security practices as defined by [NIST SP 800-218 Secure Software
          Development Framework (SSDF) Version 1.1](https://csrc.nist.gov/pubs/sp/800/218/final)
          or [CISA Secure Software Development Attestation Form](https://www.cisa.gov/resources-tools/resources/secure-software-development-attestation-form).
        meaning: spdx_core:ExternalRefType/secureSoftwareAttestation
      securityAdversaryModel:
        text: securityAdversaryModel
        description: A reference to the security adversary model for a package.
        meaning: spdx_core:ExternalRefType/securityAdversaryModel
      securityAdvisory:
        text: securityAdvisory
        description: A reference to a published security advisory (where advisory
          as defined per [ISO 29147:2018](https://www.iso.org/standard/72311.html))
          that may affect one or more elements, e.g., vendor advisories or specific
          NVD entries.
        meaning: spdx_core:ExternalRefType/securityAdvisory
      securityFix:
        text: securityFix
        description: A reference to the patch or source code that fixes a vulnerability.
        meaning: spdx_core:ExternalRefType/securityFix
      securityOther:
        text: securityOther
        description: A reference to related security information of unspecified type.
        meaning: spdx_core:ExternalRefType/securityOther
      securityPenTestReport:
        text: securityPenTestReport
        description: A reference to a [penetration test](https://en.wikipedia.org/wiki/Penetration_test)
          report for a package.
        meaning: spdx_core:ExternalRefType/securityPenTestReport
      securityPolicy:
        text: securityPolicy
        description: A reference to instructions for reporting newly discovered security
          vulnerabilities for a package.
        meaning: spdx_core:ExternalRefType/securityPolicy
      securityThreatModel:
        text: securityThreatModel
        description: A reference the [security threat model](https://en.wikipedia.org/wiki/Threat_model)
          for a package.
        meaning: spdx_core:ExternalRefType/securityThreatModel
      socialMedia:
        text: socialMedia
        description: A reference to a social media channel for a package.
        meaning: spdx_core:ExternalRefType/socialMedia
      sourceArtifact:
        text: sourceArtifact
        description: A reference to an artifact containing the sources for a package.
        meaning: spdx_core:ExternalRefType/sourceArtifact
      staticAnalysisReport:
        text: staticAnalysisReport
        description: A reference to a static analysis report for a package.
        meaning: spdx_core:ExternalRefType/staticAnalysisReport
      support:
        text: support
        description: A reference to the software support channel or other support
          information for a package.
        meaning: spdx_core:ExternalRefType/support
      vcs:
        text: vcs
        description: A reference to a version control system related to a software
          artifact.
        meaning: spdx_core:ExternalRefType/vcs
      vulnerabilityDisclosureReport:
        text: vulnerabilityDisclosureReport
        description: A reference to a Vulnerability Disclosure Report (VDR) which
          provides the software supplier's analysis and findings describing the impact
          (or lack of impact) that reported vulnerabilities have on packages or products
          in the supplier's SBOM as defined in [NIST SP 800-161 Cybersecurity Supply
          Chain Risk Management Practices for Systems and Organizations](https://csrc.nist.gov/pubs/sp/800/161/r1/final).
        meaning: spdx_core:ExternalRefType/vulnerabilityDisclosureReport
      vulnerabilityExploitabilityAssessment:
        text: vulnerabilityExploitabilityAssessment
        description: A reference to a Vulnerability Exploitability eXchange (VEX)
          statement which provides information on whether a product is impacted by
          a specific vulnerability in an included package and, if affected, whether
          there are actions recommended to remediate. See also [NTIA VEX one-page
          summary](https://ntia.gov/files/ntia/publications/vex_one-page_summary.pdf).
        meaning: spdx_core:ExternalRefType/vulnerabilityExploitabilityAssessment
  HashAlgorithm:
    name: HashAlgorithm
    definition_uri: https://w3id.org/lmodel/spdx/HashAlgorithm
    description: A mathematical algorithm that maps data of arbitrary size to a bit
      string.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/HashAlgorithm/
    enum_uri: spdx_core:HashAlgorithm
    permissible_values:
      adler32:
        text: adler32
        description: Adler-32 checksum is part of the widely used zlib compression
          library as defined in [RFC 1950](https://datatracker.ietf.org/doc/rfc1950/)
          Section 2.3.
        meaning: spdx_core:HashAlgorithm/adler32
      blake2b256:
        text: blake2b256
        description: BLAKE2b algorithm with a digest size of 256, as defined in [RFC
          7693](https://datatracker.ietf.org/doc/rfc7693/) Section 4.
        meaning: spdx_core:HashAlgorithm/blake2b256
      blake2b384:
        text: blake2b384
        description: BLAKE2b algorithm with a digest size of 384, as defined in [RFC
          7693](https://datatracker.ietf.org/doc/rfc7693/) Section 4.
        meaning: spdx_core:HashAlgorithm/blake2b384
      blake2b512:
        text: blake2b512
        description: BLAKE2b algorithm with a digest size of 512, as defined in [RFC
          7693](https://datatracker.ietf.org/doc/rfc7693/) Section 4.
        meaning: spdx_core:HashAlgorithm/blake2b512
      blake3:
        text: blake3
        description: '[BLAKE3](https://github.com/BLAKE3-team/BLAKE3-specs/blob/master/blake3.pdf)'
        meaning: spdx_core:HashAlgorithm/blake3
      crystalsDilithium:
        text: crystalsDilithium
        description: '[Dilithium](https://pq-crystals.org/dilithium/)'
        meaning: spdx_core:HashAlgorithm/crystalsDilithium
      crystalsKyber:
        text: crystalsKyber
        description: '[Kyber](https://pq-crystals.org/kyber/)'
        meaning: spdx_core:HashAlgorithm/crystalsKyber
      falcon:
        text: falcon
        description: '[FALCON](https://falcon-sign.info/falcon.pdf)'
        meaning: spdx_core:HashAlgorithm/falcon
      md2:
        text: md2
        description: MD2 message-digest algorithm, as defined in [RFC 1319](https://datatracker.ietf.org/doc/rfc1319/).
        meaning: spdx_core:HashAlgorithm/md2
      md4:
        text: md4
        description: MD4 message-digest algorithm, as defined in [RFC 1186](https://datatracker.ietf.org/doc/rfc1186/).
        meaning: spdx_core:HashAlgorithm/md4
      md5:
        text: md5
        description: MD5 message-digest algorithm, as defined in [RFC 1321](https://datatracker.ietf.org/doc/rfc1321/).
        meaning: spdx_core:HashAlgorithm/md5
      md6:
        text: md6
        description: '[MD6 hash function](https://people.csail.mit.edu/rivest/pubs/RABCx08.pdf)'
        meaning: spdx_core:HashAlgorithm/md6
      other:
        text: other
        description: any hashing algorithm that does not exist in this list of entries
        meaning: spdx_core:HashAlgorithm/other
      sha1:
        text: sha1
        description: SHA-1, a secure hashing algorithm, as defined in [RFC 3174](https://datatracker.ietf.org/doc/rfc3174/).
        meaning: spdx_core:HashAlgorithm/sha1
      sha224:
        text: sha224
        description: SHA-2 with a digest length of 224, as defined in [RFC 3874](https://datatracker.ietf.org/doc/rfc3874/).
        meaning: spdx_core:HashAlgorithm/sha224
      sha256:
        text: sha256
        description: SHA-2 with a digest length of 256, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
        meaning: spdx_core:HashAlgorithm/sha256
      sha384:
        text: sha384
        description: SHA-2 with a digest length of 384, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
        meaning: spdx_core:HashAlgorithm/sha384
      sha3_224:
        text: sha3_224
        description: SHA-3 with a digest length of 224, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_224
      sha3_256:
        text: sha3_256
        description: SHA-3 with a digest length of 256, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_256
      sha3_384:
        text: sha3_384
        description: SHA-3 with a digest length of 384, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_384
      sha3_512:
        text: sha3_512
        description: SHA-3 with a digest length of 512, as defined in [FIPS 202](https://csrc.nist.gov/pubs/fips/202/final).
        meaning: spdx_core:HashAlgorithm/sha3_512
      sha512:
        text: sha512
        description: SHA-2 with a digest length of 512, as defined in [RFC 6234](https://datatracker.ietf.org/doc/rfc6234/).
        meaning: spdx_core:HashAlgorithm/sha512
  LifecycleScopeType:
    name: LifecycleScopeType
    definition_uri: https://w3id.org/lmodel/spdx/LifecycleScopeType
    description: Provide an enumerated set of lifecycle phases that can provide context
      to relationships.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/LifecycleScopeType/
    enum_uri: spdx_core:LifecycleScopeType
    permissible_values:
      build:
        text: build
        description: A relationship has specific context implications during an element's
          build phase, during development.
        meaning: spdx_core:LifecycleScopeType/build
      design:
        text: design
        description: A relationship has specific context implications during an element's
          design.
        meaning: spdx_core:LifecycleScopeType/design
      development:
        text: development
        description: A relationship has specific context implications during development
          phase of an element.
        meaning: spdx_core:LifecycleScopeType/development
      other:
        text: other
        description: A relationship has other specific context information necessary
          to capture that the above set of enumerations does not handle.
        meaning: spdx_core:LifecycleScopeType/other
      runtime:
        text: runtime
        description: A relationship has specific context implications during the execution
          phase of an element.
        meaning: spdx_core:LifecycleScopeType/runtime
      test:
        text: test
        description: A relationship has specific context implications during an element's
          testing phase, during development.
        meaning: spdx_core:LifecycleScopeType/test
  PresenceType:
    name: PresenceType
    definition_uri: https://w3id.org/lmodel/spdx/PresenceType
    description: Categories of presence or absence.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/PresenceType/
    enum_uri: spdx_core:PresenceType
    permissible_values:
      'no':
        text: 'no'
        description: Indicates absence of the field.
        meaning: spdx_core:PresenceType/no
      noAssertion:
        text: noAssertion
        description: Makes no assertion about the field.
        meaning: spdx_core:PresenceType/noAssertion
      'yes':
        text: 'yes'
        description: Indicates presence of the field.
        meaning: spdx_core:PresenceType/yes
  ProfileIdentifierType:
    name: ProfileIdentifierType
    definition_uri: https://w3id.org/lmodel/spdx/ProfileIdentifierType
    description: Enumeration of the valid profiles.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/ProfileIdentifierType/
    enum_uri: spdx_core:ProfileIdentifierType
    permissible_values:
      ai:
        text: ai
        description: the element follows the AI profile specification
        meaning: spdx_core:ProfileIdentifierType/ai
      build:
        text: build
        description: the element follows the Build profile specification
        meaning: spdx_core:ProfileIdentifierType/build
      core:
        text: core
        description: the element follows the Core profile specification
        meaning: spdx_core:ProfileIdentifierType/core
      dataset:
        text: dataset
        description: the element follows the Dataset profile specification
        meaning: spdx_core:ProfileIdentifierType/dataset
      expandedLicensing:
        text: expandedLicensing
        description: the element follows the ExpandedLicensing profile specification
        meaning: spdx_core:ProfileIdentifierType/expandedLicensing
      extension:
        text: extension
        description: the element follows the Extension profile specification
        meaning: spdx_core:ProfileIdentifierType/extension
      lite:
        text: lite
        description: the element follows the Lite profile specification
        meaning: spdx_core:ProfileIdentifierType/lite
      security:
        text: security
        description: the element follows the Security profile specification
        meaning: spdx_core:ProfileIdentifierType/security
      simpleLicensing:
        text: simpleLicensing
        description: the element follows the SimpleLicensing profile specification
        meaning: spdx_core:ProfileIdentifierType/simpleLicensing
      software:
        text: software
        description: the element follows the Software profile specification
        meaning: spdx_core:ProfileIdentifierType/software
  RelationshipCompleteness:
    name: RelationshipCompleteness
    definition_uri: https://w3id.org/lmodel/spdx/RelationshipCompleteness
    description: Indicates whether a relationship is known to be complete, incomplete,
      or if no assertion is made with respect to relationship completeness.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/RelationshipCompleteness/
    enum_uri: spdx_core:RelationshipCompleteness
    permissible_values:
      complete:
        text: complete
        description: The relationship is known to be exhaustive.
        meaning: spdx_core:RelationshipCompleteness/complete
      incomplete:
        text: incomplete
        description: The relationship is known not to be exhaustive.
        meaning: spdx_core:RelationshipCompleteness/incomplete
      noAssertion:
        text: noAssertion
        description: No assertion can be made about the completeness of the relationship.
        meaning: spdx_core:RelationshipCompleteness/noAssertion
  RelationshipType:
    name: RelationshipType
    definition_uri: https://w3id.org/lmodel/spdx/RelationshipType
    description: Information about the relationship between two Elements.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/RelationshipType/
    enum_uri: spdx_core:RelationshipType
    permissible_values:
      affects:
        text: affects
        description: The `from` Vulnerability affects each `to` Element. The use of
          the `affects` type is constrained to `VexAffectedVulnAssessmentRelationship`
          classed relationships.
        meaning: spdx_core:RelationshipType/affects
      amendedBy:
        text: amendedBy
        description: The `from` Element is amended by each `to` Element.
        meaning: spdx_core:RelationshipType/amendedBy
      ancestorOf:
        text: ancestorOf
        description: The `from` Element is an ancestor of each `to` Element.
        meaning: spdx_core:RelationshipType/ancestorOf
      availableFrom:
        text: availableFrom
        description: The `from` Element is available from the additional supplier
          described by each `to` Element.
        meaning: spdx_core:RelationshipType/availableFrom
      configures:
        text: configures
        description: The `from` Element is a configuration applied to each `to` Element,
          during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/configures
      contains:
        text: contains
        description: The `from` Element contains each `to` Element.
        meaning: spdx_core:RelationshipType/contains
      coordinatedBy:
        text: coordinatedBy
        description: The `from` Vulnerability is coordinatedBy the `to` Agent(s) (vendor,
          researcher, or consumer agent).
        meaning: spdx_core:RelationshipType/coordinatedBy
      copiedTo:
        text: copiedTo
        description: The `from` Element has been copied to each `to` Element.
        meaning: spdx_core:RelationshipType/copiedTo
      delegatedTo:
        text: delegatedTo
        description: The `from` Agent is delegating an action to the Agent of the
          `to` Relationship (which must be of type invokedBy), during a LifecycleScopeType
          (e.g. the `to` invokedBy Relationship is being done on behalf of `from`).
        meaning: spdx_core:RelationshipType/delegatedTo
      dependsOn:
        text: dependsOn
        description: The `from` Element depends on each `to` Element, during a LifecycleScopeType
          period.
        meaning: spdx_core:RelationshipType/dependsOn
      descendantOf:
        text: descendantOf
        description: The `from` Element is a descendant of each `to` Element.
        meaning: spdx_core:RelationshipType/descendantOf
      describes:
        text: describes
        description: The `from` Element describes each `to` Element. To denote the
          root(s) of a tree of elements in a collection, the rootElement property
          should be used.
        meaning: spdx_core:RelationshipType/describes
      doesNotAffect:
        text: doesNotAffect
        description: The `from` Vulnerability has no impact on each `to` Element.
          The use of the `doesNotAffect` is constrained to `VexNotAffectedVulnAssessmentRelationship`
          classed relationships.
        meaning: spdx_core:RelationshipType/doesNotAffect
      expandsTo:
        text: expandsTo
        description: The `from` archive expands out as an artifact described by each
          `to` Element.
        meaning: spdx_core:RelationshipType/expandsTo
      exploitCreatedBy:
        text: exploitCreatedBy
        description: The `from` Vulnerability has had an exploit created against it
          by each `to` Agent.
        meaning: spdx_core:RelationshipType/exploitCreatedBy
      fixedBy:
        text: fixedBy
        description: Designates a `from` Vulnerability has been fixed by the `to`
          Agent(s).
        meaning: spdx_core:RelationshipType/fixedBy
      fixedIn:
        text: fixedIn
        description: A `from` Vulnerability has been fixed in each `to` Element. The
          use of the `fixedIn` type is constrained to `VexFixedVulnAssessmentRelationship`
          classed relationships.
        meaning: spdx_core:RelationshipType/fixedIn
      foundBy:
        text: foundBy
        description: Designates a `from` Vulnerability was originally discovered by
          the `to` Agent(s).
        meaning: spdx_core:RelationshipType/foundBy
      generates:
        text: generates
        description: The `from` Element generates each `to` Element.
        meaning: spdx_core:RelationshipType/generates
      hasAddedFile:
        text: hasAddedFile
        description: Every `to` Element is a file added to the `from` Element (`from`
          hasAddedFile `to`).
        meaning: spdx_core:RelationshipType/hasAddedFile
      hasAssessmentFor:
        text: hasAssessmentFor
        description: Relates a `from` Vulnerability and each `to` Element with a security
          assessment. To be used with `VulnAssessmentRelationship` types.
        meaning: spdx_core:RelationshipType/hasAssessmentFor
      hasAssociatedVulnerability:
        text: hasAssociatedVulnerability
        description: Used to associate a `from` Artifact with each `to` Vulnerability.
        meaning: spdx_core:RelationshipType/hasAssociatedVulnerability
      hasConcludedLicense:
        text: hasConcludedLicense
        description: The `from` SoftwareArtifact is concluded by the SPDX data creator
          to be governed by each `to` license.
        meaning: spdx_core:RelationshipType/hasConcludedLicense
      hasDataFile:
        text: hasDataFile
        description: 'The `from` Element treats each `to` Element as a data file.
          A data file is an artifact that stores data required or optional for the
          `from` Element''s functionality. A data file can be a database file, an
          index file, a log file, an AI model file, a calibration data file, a temporary
          file, a backup file, and more. For AI training dataset, test dataset, test
          artifact, configuration data, build input data, and build output data, please
          consider using the more specific relationship types: `trainedOn`, `testedOn`,
          `hasTest`, `configures`, `hasInput`, and `hasOutput`, respectively. This
          relationship does not imply dependency.'
        meaning: spdx_core:RelationshipType/hasDataFile
      hasDeclaredLicense:
        text: hasDeclaredLicense
        description: The `from` SoftwareArtifact was discovered to actually contain
          each `to` license, for example as detected by use of automated tooling.
        meaning: spdx_core:RelationshipType/hasDeclaredLicense
      hasDeletedFile:
        text: hasDeletedFile
        description: Every `to` Element is a file deleted from the `from` Element
          (`from` hasDeletedFile `to`).
        meaning: spdx_core:RelationshipType/hasDeletedFile
      hasDependencyManifest:
        text: hasDependencyManifest
        description: The `from` Element has manifest files that contain dependency
          information in each `to` Element.
        meaning: spdx_core:RelationshipType/hasDependencyManifest
      hasDistributionArtifact:
        text: hasDistributionArtifact
        description: The `from` Element is distributed as an artifact in each `to`
          Element (e.g. an RPM or archive file).
        meaning: spdx_core:RelationshipType/hasDistributionArtifact
      hasDocumentation:
        text: hasDocumentation
        description: The `from` Element is documented by each `to` Element.
        meaning: spdx_core:RelationshipType/hasDocumentation
      hasDynamicLink:
        text: hasDynamicLink
        description: The `from` Element dynamically links in each `to` Element, during
          a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasDynamicLink
      hasEvidence:
        text: hasEvidence
        description: Every `to` Element is considered as evidence for the `from` Element
          (`from` hasEvidence `to`).
        meaning: spdx_core:RelationshipType/hasEvidence
      hasExample:
        text: hasExample
        description: Every `to` Element is an example for the `from` Element (`from`
          hasExample `to`).
        meaning: spdx_core:RelationshipType/hasExample
      hasHost:
        text: hasHost
        description: The `from` Build was run on the `to` Element during a LifecycleScopeType
          period (e.g. the host that the build runs on).
        meaning: spdx_core:RelationshipType/hasHost
      hasInput:
        text: hasInput
        description: The `from` Build has each `to` Element as an input, during a
          LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasInput
      hasMetadata:
        text: hasMetadata
        description: Every `to` Element is metadata about the `from` Element (`from`
          hasMetadata `to`).
        meaning: spdx_core:RelationshipType/hasMetadata
      hasOptionalComponent:
        text: hasOptionalComponent
        description: Every `to` Element is an optional component of the `from` Element
          (`from` hasOptionalComponent `to`).
        meaning: spdx_core:RelationshipType/hasOptionalComponent
      hasOptionalDependency:
        text: hasOptionalDependency
        description: The `from` Element optionally depends on each `to` Element, during
          a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasOptionalDependency
      hasOutput:
        text: hasOutput
        description: The `from` Build element generates each `to` Element as an output,
          during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasOutput
      hasPrerequisite:
        text: hasPrerequisite
        description: The `from` Element has a prerequisite on each `to` Element, during
          a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasPrerequisite
      hasProvidedDependency:
        text: hasProvidedDependency
        description: The `from` Element has a dependency on each `to` Element, dependency
          is not in the distributed artifact, but assumed to be provided, during a
          LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasProvidedDependency
      hasRequirement:
        text: hasRequirement
        description: The `from` Element has a requirement on each `to` Element, during
          a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasRequirement
      hasSpecification:
        text: hasSpecification
        description: Every `to` Element is a specification for the `from` Element
          (`from` hasSpecification `to`), during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasSpecification
      hasStaticLink:
        text: hasStaticLink
        description: The `from` Element statically links in each `to` Element, during
          a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasStaticLink
      hasTest:
        text: hasTest
        description: Every `to` Element is a test artifact for the `from` Element
          (`from` hasTest `to`), during a LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/hasTest
      hasTestCase:
        text: hasTestCase
        description: Every `to` Element is a test case for the `from` Element (`from`
          hasTestCase `to`).
        meaning: spdx_core:RelationshipType/hasTestCase
      hasVariant:
        text: hasVariant
        description: Every `to` Element is a variant the `from` Element (`from` hasVariant
          `to`).
        meaning: spdx_core:RelationshipType/hasVariant
      invokedBy:
        text: invokedBy
        description: The `from` Element was invoked by the `to` Agent, during a LifecycleScopeType
          period (for example, a Build element that describes a build step).
        meaning: spdx_core:RelationshipType/invokedBy
      modifiedBy:
        text: modifiedBy
        description: The `from` Element is modified by each `to` Element.
        meaning: spdx_core:RelationshipType/modifiedBy
      other:
        text: other
        description: Every `to` Element is related to the `from` Element where the
          relationship type is not described by any of the SPDX relationship types
          (this relationship is directionless).
        meaning: spdx_core:RelationshipType/other
      packagedBy:
        text: packagedBy
        description: Every `to` Element is a packaged instance of the `from` Element
          (`from` packagedBy `to`).
        meaning: spdx_core:RelationshipType/packagedBy
      patchedBy:
        text: patchedBy
        description: Every `to` Element is a patch for the `from` Element (`from`
          patchedBy `to`).
        meaning: spdx_core:RelationshipType/patchedBy
      publishedBy:
        text: publishedBy
        description: Designates a `from` Vulnerability was made available for public
          use or reference by each `to` Agent.
        meaning: spdx_core:RelationshipType/publishedBy
      reportedBy:
        text: reportedBy
        description: Designates a `from` Vulnerability was first reported to a project,
          vendor, or tracking database for formal identification by each `to` Agent.
        meaning: spdx_core:RelationshipType/reportedBy
      republishedBy:
        text: republishedBy
        description: Designates a `from` Vulnerability's details were tracked, aggregated,
          and/or enriched to improve context (i.e. NVD) by each `to` Agent.
        meaning: spdx_core:RelationshipType/republishedBy
      serializedInArtifact:
        text: serializedInArtifact
        description: The `from` SpdxDocument can be found in a serialized form in
          each `to` Artifact.
        meaning: spdx_core:RelationshipType/serializedInArtifact
      testedOn:
        text: testedOn
        description: The `from` Element has been tested on the `to` Element(s).
        meaning: spdx_core:RelationshipType/testedOn
      trainedOn:
        text: trainedOn
        description: The `from` Element has been trained on the `to` Element(s).
        meaning: spdx_core:RelationshipType/trainedOn
      underInvestigationFor:
        text: underInvestigationFor
        description: The `from` Vulnerability impact is being investigated for each
          `to` Element. The use of the `underInvestigationFor` type is constrained
          to `VexUnderInvestigationVulnAssessmentRelationship` classed relationships.
        meaning: spdx_core:RelationshipType/underInvestigationFor
      usesTool:
        text: usesTool
        description: The `from` Element uses each `to` Element as a tool, during a
          LifecycleScopeType period.
        meaning: spdx_core:RelationshipType/usesTool
  SupportType:
    name: SupportType
    definition_uri: https://w3id.org/lmodel/spdx/SupportType
    description: Indicates the type of support that is associated with an artifact.
    in_subset:
    - spdx_core
    from_schema: https://w3id.org/lmodel/spdx/spdx_core
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Core/Vocabularies/SupportType/
    enum_uri: spdx_core:SupportType
    permissible_values:
      deployed:
        text: deployed
        description: in addition to being supported by the supplier, the software
          is known to have been deployed and is in use. For a software as a service
          provider, this implies the software is now available as a service.
        meaning: spdx_core:SupportType/deployed
      development:
        text: development
        description: the artifact is in active development and is not considered ready
          for formal support from the supplier.
        meaning: spdx_core:SupportType/development
      endOfSupport:
        text: endOfSupport
        description: there is a defined end of support for the artifact from the supplier.
          This may also be referred to as end of life. There is a validUntilDate that
          can be used to signal when support ends for the artifact.
        meaning: spdx_core:SupportType/endOfSupport
      limitedSupport:
        text: limitedSupport
        description: the artifact has been released, and there is limited support
          available from the supplier. There is a validUntilDate that can provide
          additional information about the duration of support.
        meaning: spdx_core:SupportType/limitedSupport
      noAssertion:
        text: noAssertion
        description: no assertion about the type of support is made. This is considered
          the default if no other support type is used.
        meaning: spdx_core:SupportType/noAssertion
      noSupport:
        text: noSupport
        description: there is no support for the artifact from the supplier, consumer
          assumes any support obligations.
        meaning: spdx_core:SupportType/noSupport
      support:
        text: support
        description: the artifact has been released, and is supported from the supplier.
          There is a validUntilDate that can provide additional information about
          the duration of support.
        meaning: spdx_core:SupportType/support
  ContentIdentifierType:
    name: ContentIdentifierType
    definition_uri: https://w3id.org/lmodel/spdx/ContentIdentifierType
    description: Specifies the type of a content identifier.
    in_subset:
    - spdx_software
    from_schema: https://w3id.org/lmodel/spdx/spdx_software
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/ContentIdentifierType/
    enum_uri: spdx_software:ContentIdentifierType
    permissible_values:
      gitoid:
        text: gitoid
        description: '[Gitoid](https://www.iana.org/assignments/uri-schemes/prov/gitoid),
          stands for [Git Object ID](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects).
          A gitoid of type blob is a unique hash of a binary artifact. A gitoid may
          represent either an [Artifact Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-identifier-types)
          for the software artifact or an [Input Manifest Identifier](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#input-manifest-identifier)
          for the software artifact''s associated [Artifact Input Manifest](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-input-manifest);
          this ambiguity exists because the Artifact Input Manifest is itself an artifact,
          and the gitoid of that artifact is its valid identifier. Gitoids calculated
          on software artifacts (Snippet, File, or Package Elements) should be recorded
          in the SPDX 3.0 SoftwareArtifact''s contentIdentifier property. Gitoids
          calculated on the Artifact Input Manifest (Input Manifest Identifier) should
          be recorded in the SPDX 3.0 Element''s externalIdentifier property. See
          [OmniBOR Specification](https://github.com/omnibor/spec/), a minimalistic
          specification for describing software [Artifact Dependency Graphs](https://github.com/omnibor/spec/blob/eb1ee5c961c16215eb8709b2975d193a2007a35d/spec/SPEC.md#artifact-dependency-graph-adg).'
        meaning: spdx_software:ContentIdentifierType/gitoid
      swhid:
        text: swhid
        description: SoftWare Hash IDentifier, a persistent intrinsic identifier for
          digital artifacts, such as files, trees (also known as directories or folders),
          commits, and other objects typically found in version control systems. The
          format of the identifiers is defined in the [SWHID specification](https://www.swhid.org/specification/v1.1/4.Syntax)
          (ISO/IEC DIS 18670). They typically look like `swh:1:cnt:94a9ed024d3859793618152ea559a168bbcbb5e2`.
        meaning: spdx_software:ContentIdentifierType/swhid
  FileKindType:
    name: FileKindType
    definition_uri: https://w3id.org/lmodel/spdx/FileKindType
    description: Enumeration of the different kinds of SPDX file.
    in_subset:
    - spdx_software
    from_schema: https://w3id.org/lmodel/spdx/spdx_software
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/FileKindType/
    enum_uri: spdx_software:FileKindType
    permissible_values:
      directory:
        text: directory
        description: The file represents a directory and all content stored in that
          directory.
        meaning: spdx_software:FileKindType/directory
      file:
        text: file
        description: The file represents a single file (default).
        meaning: spdx_software:FileKindType/file
  SbomType:
    name: SbomType
    definition_uri: https://w3id.org/lmodel/spdx/SbomType
    description: Provides a set of values to be used to describe the common types
      of SBOMs that tools may create.
    in_subset:
    - spdx_software
    from_schema: https://w3id.org/lmodel/spdx/spdx_software
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/SbomType/
    enum_uri: spdx_software:SbomType
    permissible_values:
      analyzed:
        text: analyzed
        description: SBOM generated through analysis of artifacts (e.g., executables,
          packages, containers, and virtual machine images) after its build. Such
          analysis generally requires a variety of heuristics. In some contexts, this
          may also be referred to as a "3rd party" SBOM.
        meaning: spdx_software:SbomType/analyzed
      build:
        text: build
        description: SBOM generated as part of the process of building the software
          to create a releasable artifact (e.g., executable or package) from data
          such as source files, dependencies, built components, build process ephemeral
          data, and other SBOMs.
        meaning: spdx_software:SbomType/build
      deployed:
        text: deployed
        description: SBOM provides an inventory of software that is present on a system.
          This may be an assembly of other SBOMs that combines analysis of configuration
          options, and examination of execution behavior in a (potentially simulated)
          deployment environment.
        meaning: spdx_software:SbomType/deployed
      design:
        text: design
        description: SBOM of intended, planned software project or product with included
          components (some of which may not yet exist) for a new software artifact.
        meaning: spdx_software:SbomType/design
      runtime:
        text: runtime
        description: SBOM generated through instrumenting the system running the software,
          to capture only components present in the system, as well as external call-outs
          or dynamically loaded components. In some contexts, this may also be referred
          to as an "Instrumented" or "Dynamic" SBOM.
        meaning: spdx_software:SbomType/runtime
      source:
        text: source
        description: SBOM created directly from the development environment, source
          files, and included dependencies used to build an product artifact.
        meaning: spdx_software:SbomType/source
  SoftwarePurpose:
    name: SoftwarePurpose
    definition_uri: https://w3id.org/lmodel/spdx/SoftwarePurpose
    description: Provides information about the primary purpose of an Element.
    in_subset:
    - spdx_software
    from_schema: https://w3id.org/lmodel/spdx/spdx_software
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Software/Vocabularies/SoftwarePurpose/
    enum_uri: spdx_software:SoftwarePurpose
    permissible_values:
      application:
        text: application
        description: The Element is a software application.
        meaning: spdx_software:SoftwarePurpose/application
      archive:
        text: archive
        description: The Element is an archived collection of one or more files (.tar,
          .zip, etc.).
        meaning: spdx_software:SoftwarePurpose/archive
      bom:
        text: bom
        description: The Element is a bill of materials.
        meaning: spdx_software:SoftwarePurpose/bom
      configuration:
        text: configuration
        description: The Element is configuration data.
        meaning: spdx_software:SoftwarePurpose/configuration
      container:
        text: container
        description: The Element is a container image which can be used by a container
          runtime application.
        meaning: spdx_software:SoftwarePurpose/container
      data:
        text: data
        description: The Element is data.
        meaning: spdx_software:SoftwarePurpose/data
      device:
        text: device
        description: The Element refers to a chipset, processor, or electronic board.
        meaning: spdx_software:SoftwarePurpose/device
      deviceDriver:
        text: deviceDriver
        description: The Element represents software that controls hardware devices.
        meaning: spdx_software:SoftwarePurpose/deviceDriver
      diskImage:
        text: diskImage
        description: The Element refers to a disk image that can be written to a disk,
          booted in a VM, etc. A disk image typically contains most or all of the
          components necessary to boot, such as bootloaders, kernels, firmware, userspace,
          etc.
        meaning: spdx_software:SoftwarePurpose/diskImage
      documentation:
        text: documentation
        description: The Element is documentation.
        meaning: spdx_software:SoftwarePurpose/documentation
      evidence:
        text: evidence
        description: The Element is the evidence that a specification or requirement
          has been fulfilled.
        meaning: spdx_software:SoftwarePurpose/evidence
      executable:
        text: executable
        description: The Element is an Artifact that can be run on a computer.
        meaning: spdx_software:SoftwarePurpose/executable
      file:
        text: file
        description: The Element is a single file which can be independently distributed
          (configuration file, statically linked binary, Kubernetes deployment, etc.).
        meaning: spdx_software:SoftwarePurpose/file
      filesystemImage:
        text: filesystemImage
        description: The Element is a file system image that can be written to a disk
          (or virtual) partition.
        meaning: spdx_software:SoftwarePurpose/filesystemImage
      firmware:
        text: firmware
        description: The Element provides low level control over a device's hardware.
        meaning: spdx_software:SoftwarePurpose/firmware
      framework:
        text: framework
        description: The Element is a software framework.
        meaning: spdx_software:SoftwarePurpose/framework
      install:
        text: install
        description: The Element is used to install software on disk.
        meaning: spdx_software:SoftwarePurpose/install
      library:
        text: library
        description: The Element is a software library.
        meaning: spdx_software:SoftwarePurpose/library
      manifest:
        text: manifest
        description: The Element is a software manifest.
        meaning: spdx_software:SoftwarePurpose/manifest
      model:
        text: model
        description: The Element is a machine learning or artificial intelligence
          model.
        meaning: spdx_software:SoftwarePurpose/model
      module:
        text: module
        description: The Element is a module of a piece of software.
        meaning: spdx_software:SoftwarePurpose/module
      operatingSystem:
        text: operatingSystem
        description: The Element is an operating system.
        meaning: spdx_software:SoftwarePurpose/operatingSystem
      other:
        text: other
        description: The Element doesn't fit into any of the other categories.
        meaning: spdx_software:SoftwarePurpose/other
      patch:
        text: patch
        description: The Element contains a set of changes to update, fix, or improve
          another Element.
        meaning: spdx_software:SoftwarePurpose/patch
      platform:
        text: platform
        description: The Element represents a runtime environment.
        meaning: spdx_software:SoftwarePurpose/platform
      requirement:
        text: requirement
        description: The Element provides a requirement needed as input for another
          Element.
        meaning: spdx_software:SoftwarePurpose/requirement
      source:
        text: source
        description: The Element is a single or a collection of source files.
        meaning: spdx_software:SoftwarePurpose/source
      specification:
        text: specification
        description: The Element is a plan, guideline or strategy how to create, perform
          or analyze an application.
        meaning: spdx_software:SoftwarePurpose/specification
      test:
        text: test
        description: The Element is a test used to verify functionality on an software
          element.
        meaning: spdx_software:SoftwarePurpose/test
  EnergyUnitType:
    name: EnergyUnitType
    definition_uri: https://w3id.org/lmodel/spdx/EnergyUnitType
    description: Specifies the unit of energy consumption.
    in_subset:
    - spdx_ai
    from_schema: https://w3id.org/lmodel/spdx/spdx_ai
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/AI/Vocabularies/EnergyUnitType/
    enum_uri: spdx_ai:EnergyUnitType
    permissible_values:
      kilowattHour:
        text: kilowattHour
        description: Kilowatt-hour.
        meaning: spdx_ai:EnergyUnitType/kilowattHour
      megajoule:
        text: megajoule
        description: Megajoule.
        meaning: spdx_ai:EnergyUnitType/megajoule
      other:
        text: other
        description: Any other units of energy measurement.
        meaning: spdx_ai:EnergyUnitType/other
  SafetyRiskAssessmentType:
    name: SafetyRiskAssessmentType
    definition_uri: https://w3id.org/lmodel/spdx/SafetyRiskAssessmentType
    description: Specifies the safety risk level.
    in_subset:
    - spdx_ai
    from_schema: https://w3id.org/lmodel/spdx/spdx_ai
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/AI/Vocabularies/SafetyRiskAssessmentType/
    enum_uri: spdx_ai:SafetyRiskAssessmentType
    permissible_values:
      high:
        text: high
        description: The second-highest level of risk posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/high
      low:
        text: low
        description: Low/no risk is posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/low
      medium:
        text: medium
        description: The third-highest level of risk posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/medium
      serious:
        text: serious
        description: The highest level of risk posed by an AI system.
        meaning: spdx_ai:SafetyRiskAssessmentType/serious
  ConfidentialityLevelType:
    name: ConfidentialityLevelType
    definition_uri: https://w3id.org/lmodel/spdx/ConfidentialityLevelType
    description: Categories of confidentiality level.
    in_subset:
    - spdx_dataset
    from_schema: https://w3id.org/lmodel/spdx/spdx_dataset
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Dataset/Vocabularies/ConfidentialityLevelType/
    enum_uri: spdx_dataset:ConfidentialityLevelType
    permissible_values:
      amber:
        text: amber
        description: Data points in the dataset can be shared only with specific organizations
          and their clients on a need to know basis.
        meaning: spdx_dataset:ConfidentialityLevelType/amber
      clear:
        text: clear
        description: Dataset may be distributed freely, without restriction.
        meaning: spdx_dataset:ConfidentialityLevelType/clear
      green:
        text: green
        description: Dataset can be shared within a community of peers and partners.
        meaning: spdx_dataset:ConfidentialityLevelType/green
      red:
        text: red
        description: Data points in the dataset are highly confidential and can only
          be shared with named recipients.
        meaning: spdx_dataset:ConfidentialityLevelType/red
  DatasetAvailabilityType:
    name: DatasetAvailabilityType
    definition_uri: https://w3id.org/lmodel/spdx/DatasetAvailabilityType
    description: Availability of dataset.
    in_subset:
    - spdx_dataset
    from_schema: https://w3id.org/lmodel/spdx/spdx_dataset
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Dataset/Vocabularies/DatasetAvailabilityType/
    enum_uri: spdx_dataset:DatasetAvailabilityType
    permissible_values:
      clickthrough:
        text: clickthrough
        description: the dataset is not publicly available and can only be accessed
          after affirmatively accepting terms on a clickthrough webpage.
        meaning: spdx_dataset:DatasetAvailabilityType/clickthrough
      directDownload:
        text: directDownload
        description: the dataset is publicly available and can be downloaded directly.
        meaning: spdx_dataset:DatasetAvailabilityType/directDownload
      query:
        text: query
        description: the dataset is publicly available, but not all at once, and can
          only be accessed through queries which return parts of the dataset.
        meaning: spdx_dataset:DatasetAvailabilityType/query
      registration:
        text: registration
        description: the dataset is not publicly available and an email registration
          is required before accessing the dataset, although without an affirmative
          acceptance of terms.
        meaning: spdx_dataset:DatasetAvailabilityType/registration
      scrapingScript:
        text: scrapingScript
        description: the dataset provider is not making available the underlying data
          and the dataset must be reassembled, typically using the provided script
          for scraping the data.
        meaning: spdx_dataset:DatasetAvailabilityType/scrapingScript
  DatasetType:
    name: DatasetType
    definition_uri: https://w3id.org/lmodel/spdx/DatasetType
    description: Enumeration of dataset types.
    in_subset:
    - spdx_dataset
    from_schema: https://w3id.org/lmodel/spdx/spdx_dataset
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Dataset/Vocabularies/DatasetType/
    enum_uri: spdx_dataset:DatasetType
    permissible_values:
      audio:
        text: audio
        description: data is audio based, such as a collection of music from the 80s.
        meaning: spdx_dataset:DatasetType/audio
      categorical:
        text: categorical
        description: data that is classified into a discrete number of categories,
          such as the eye color of a population of people.
        meaning: spdx_dataset:DatasetType/categorical
      graph:
        text: graph
        description: data is in the form of a graph where entries are somehow related
          to each other through edges, such a social network of friends.
        meaning: spdx_dataset:DatasetType/graph
      image:
        text: image
        description: data is a collection of images such as pictures of animals.
        meaning: spdx_dataset:DatasetType/image
      noAssertion:
        text: noAssertion
        description: data type is not known.
        meaning: spdx_dataset:DatasetType/noAssertion
      numeric:
        text: numeric
        description: data consists only of numeric entries.
        meaning: spdx_dataset:DatasetType/numeric
      other:
        text: other
        description: data is of a type not included in this list.
        meaning: spdx_dataset:DatasetType/other
      sensor:
        text: sensor
        description: data is recorded from a physical sensor, such as a thermometer
          reading or biometric device.
        meaning: spdx_dataset:DatasetType/sensor
      structured:
        text: structured
        description: data is stored in tabular format or retrieved from a relational
          database.
        meaning: spdx_dataset:DatasetType/structured
      syntactic:
        text: syntactic
        description: data describes the syntax or semantics of a language or text,
          such as a parse tree used for natural language processing.
        meaning: spdx_dataset:DatasetType/syntactic
      text:
        text: text
        description: data consists of unstructured text, such as a book, Wikipedia
          article (without images), or transcript.
        meaning: spdx_dataset:DatasetType/text
      timeseries:
        text: timeseries
        description: data is recorded in an ordered sequence of timestamped entries,
          such as the price of a stock over the course of a day.
        meaning: spdx_dataset:DatasetType/timeseries
      timestamp:
        text: timestamp
        description: data is recorded with a timestamp for each entry, but not necessarily
          ordered or at specific intervals, such as when a taxi ride starts and ends.
        meaning: spdx_dataset:DatasetType/timestamp
      video:
        text: video
        description: data is video based, such as a collection of movie clips featuring
          Tom Hanks.
        meaning: spdx_dataset:DatasetType/video
  CvssSeverityType:
    name: CvssSeverityType
    definition_uri: https://w3id.org/lmodel/spdx/CvssSeverityType
    description: Specifies the CVSS base, temporal, threat, or environmental severity
      type.
    in_subset:
    - spdx_security
    from_schema: https://w3id.org/lmodel/spdx/spdx_security
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/CvssSeverityType/
    enum_uri: spdx_security:CvssSeverityType
    permissible_values:
      critical:
        text: critical
        description: When a CVSS score is between 9.0 - 10.0
        meaning: spdx_security:CvssSeverityType/critical
      high:
        text: high
        description: When a CVSS score is between 7.0 - 8.9
        meaning: spdx_security:CvssSeverityType/high
      low:
        text: low
        description: When a CVSS score is between 0.1 - 3.9
        meaning: spdx_security:CvssSeverityType/low
      medium:
        text: medium
        description: When a CVSS score is between 4.0 - 6.9
        meaning: spdx_security:CvssSeverityType/medium
      none:
        text: none
        description: When a CVSS score is 0.0
        meaning: spdx_security:CvssSeverityType/none
  ExploitCatalogType:
    name: ExploitCatalogType
    definition_uri: https://w3id.org/lmodel/spdx/ExploitCatalogType
    description: Specifies the exploit catalog type.
    in_subset:
    - spdx_security
    from_schema: https://w3id.org/lmodel/spdx/spdx_security
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/ExploitCatalogType/
    enum_uri: spdx_security:ExploitCatalogType
    permissible_values:
      kev:
        text: kev
        description: CISA's Known Exploited Vulnerability (KEV) Catalog
        meaning: spdx_security:ExploitCatalogType/kev
      other:
        text: other
        description: Other exploit catalogs
        meaning: spdx_security:ExploitCatalogType/other
  SsvcDecisionType:
    name: SsvcDecisionType
    definition_uri: https://w3id.org/lmodel/spdx/SsvcDecisionType
    description: Specifies the SSVC decision type.
    in_subset:
    - spdx_security
    from_schema: https://w3id.org/lmodel/spdx/spdx_security
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/SsvcDecisionType/
    enum_uri: spdx_security:SsvcDecisionType
    permissible_values:
      act:
        text: act
        description: The vulnerability requires attention from the organization's
          internal, supervisory-level and leadership-level individuals. Necessary
          actions include requesting assistance or information about the vulnerability,
          as well as publishing a notification either internally and/or externally.
          Typically, internal groups would meet to determine the overall response
          and then execute agreed upon actions. CISA recommends remediating Act vulnerabilities
          as soon as possible.
        meaning: spdx_security:SsvcDecisionType/act
      attend:
        text: attend
        description: The vulnerability requires attention from the organization's
          internal, supervisory-level individuals. Necessary actions include requesting
          assistance or information about the vulnerability, and may involve publishing
          a notification either internally and/or externally. CISA recommends remediating
          Attend vulnerabilities sooner than standard update timelines.
        meaning: spdx_security:SsvcDecisionType/attend
      track:
        text: track
        description: The vulnerability does not require action at this time. The organization
          would continue to track the vulnerability and reassess it if new information
          becomes available. CISA recommends remediating Track vulnerabilities within
          standard update timelines.
        meaning: spdx_security:SsvcDecisionType/track
      trackStar:
        text: trackStar
        description: ("Track*" in the SSVC spec) The vulnerability contains specific
          characteristics that may require closer monitoring for changes. CISA recommends
          remediating Track* vulnerabilities within standard update timelines.
        meaning: spdx_security:SsvcDecisionType/trackStar
  VexJustificationType:
    name: VexJustificationType
    definition_uri: https://w3id.org/lmodel/spdx/VexJustificationType
    description: Specifies the VEX justification type.
    in_subset:
    - spdx_security
    from_schema: https://w3id.org/lmodel/spdx/spdx_security
    see_also:
    - https://spdx.github.io/spdx-spec/v3.0.1/model/Security/Vocabularies/VexJustificationType/
    enum_uri: spdx_security:VexJustificationType
    permissible_values:
      componentNotPresent:
        text: componentNotPresent
        description: The software is not affected because the vulnerable component
          is not in the product.
        meaning: spdx_security:VexJustificationType/componentNotPresent
      inlineMitigationsAlreadyExist:
        text: inlineMitigationsAlreadyExist
        description: Built-in inline controls or mitigations prevent an adversary
          from leveraging the vulnerability.
        meaning: spdx_security:VexJustificationType/inlineMitigationsAlreadyExist
      vulnerableCodeCannotBeControlledByAdversary:
        text: vulnerableCodeCannotBeControlledByAdversary
        description: The vulnerable component is present, and the component contains
          the vulnerable code. However, vulnerable code is used in such a way that
          an attacker cannot mount any anticipated attack.
        meaning: spdx_security:VexJustificationType/vulnerableCodeCannotBeControlledByAdversary
      vulnerableCodeNotInExecutePath:
        text: vulnerableCodeNotInExecutePath
        description: The affected code is not reachable through the execution of the
          code, including non-anticipated states of the product.
        meaning: spdx_security:VexJustificationType/vulnerableCodeNotInExecutePath
      vulnerableCodeNotPresent:
        text: vulnerableCodeNotPresent
        description: The product is not affected because the code underlying the vulnerability
          is not present in the product.
        meaning: spdx_security:VexJustificationType/vulnerableCodeNotPresent
