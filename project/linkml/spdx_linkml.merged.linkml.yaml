          "meaning": "spdx_core:RelationshipType/patchedBy"
        },
        "publishedBy": {
          "text": "publishedBy",
          "description": "Designates a `from` Vulnerability was made available for public use or reference by each `to` Agent.",
          "meaning": "spdx_core:RelationshipType/publishedBy"
        },
