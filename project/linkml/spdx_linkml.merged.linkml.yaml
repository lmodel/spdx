        "hasHost": {
          "text": "hasHost",
          "description": "The `from` Build was run on the `to` Element during a LifecycleScopeType period (e.g. the host that the build runs on).",
          "meaning": "spdx_core:RelationshipType/hasHost"
        },
        "hasInput": {
