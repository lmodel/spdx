      shacl_node_kind:
        tag: shacl_node_kind
        value: sh:IRI
    description: Specifies an AI package and its associated information.
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/AI/AIPackage
    is_a: Package
    slots:
    - Element_externalIdentifier
    - Element_extension
    - Element_summary
    - Element_description
    - Element_comment
    - Element_verifiedUsing
    - Element_externalRef
    - Element_name
    - Element_creationInfo
    - Artifact_standardName
    - Artifact_builtTime
    - Artifact_validUntilTime
    - Artifact_supportLevel
    - Artifact_suppliedBy
    - Artifact_originatedBy
    - Artifact_releaseTime
    - SoftwareArtifact_attributionText
    - SoftwareArtifact_primaryPurpose
    - SoftwareArtifact_additionalPurpose
    - SoftwareArtifact_contentIdentifier
    - SoftwareArtifact_copyrightText
    - Package_sourceInfo
    - Package_homePage
    - Package_downloadLocation
    - Package_packageVersion
    - Package_packageUrl
    - AIPackage_informationAboutTraining
    - AIPackage_modelDataPreprocessing
    - AIPackage_typeOfModel
    - AIPackage_safetyRiskAssessment
    - AIPackage_metricDecisionThreshold
    - AIPackage_useSensitivePersonalInformation
    - AIPackage_energyConsumption
    - AIPackage_limitation
    - AIPackage_hyperparameter
    - AIPackage_autonomyType
    - AIPackage_domain
    - AIPackage_modelExplainability
    - AIPackage_informationAboutApplication
    - AIPackage_metric
    - AIPackage_standardCompliance
    slot_usage:
      informationAboutTraining:
        name: informationAboutTraining
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: false
      modelDataPreprocessing:
        name: modelDataPreprocessing
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: true
      typeOfModel:
        name: typeOfModel
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: true
      safetyRiskAssessment:
        name: safetyRiskAssessment
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [ai:SafetyRiskAssessmentType/serious, ai:SafetyRiskAssessmentType/high,
          ai:SafetyRiskAssessmentType/medium, ai:SafetyRiskAssessmentType/low]'
        range: SafetyRiskAssessmentType
        multivalued: false
      metricDecisionThreshold:
        name: metricDecisionThreshold
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: DictionaryEntry
        multivalued: true
      useSensitivePersonalInformation:
        name: useSensitivePersonalInformation
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [core:PresenceType/yes, core:PresenceType/no, core:PresenceType/noAssertion]'
        range: PresenceType
        multivalued: false
      energyConsumption:
        name: energyConsumption
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: EnergyConsumption
        multivalued: false
      limitation:
        name: limitation
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: false
      hyperparameter:
        name: hyperparameter
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: DictionaryEntry
        multivalued: true
      autonomyType:
        name: autonomyType
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [core:PresenceType/yes, core:PresenceType/no, core:PresenceType/noAssertion]'
        range: PresenceType
        multivalued: false
      domain:
        name: domain
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: true
      modelExplainability:
        name: modelExplainability
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: true
      informationAboutApplication:
        name: informationAboutApplication
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: false
      metric:
        name: metric
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: DictionaryEntry
        multivalued: true
      standardCompliance:
        name: standardCompliance
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: true
    class_uri: https://spdx.org/rdf/3.0.1/terms/AI/AIPackage
  EnergyConsumption:
    name: EnergyConsumption
    definition_uri: https://spdx.org/rdf/3.0.1/terms/EnergyConsumption
    annotations:
      shacl_node_kind:
        tag: shacl_node_kind
        value: sh:BlankNodeOrIRI
    description: 'A class for describing the energy consumption incurred by an AI
      model in

      different stages of its lifecycle.'
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/AI/EnergyConsumption
    slots:
    - EnergyConsumption_finetuningEnergyConsumption
    - EnergyConsumption_inferenceEnergyConsumption
    - EnergyConsumption_trainingEnergyConsumption
    slot_usage:
      finetuningEnergyConsumption:
        name: finetuningEnergyConsumption
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: EnergyConsumptionDescription
        multivalued: true
      inferenceEnergyConsumption:
        name: inferenceEnergyConsumption
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: EnergyConsumptionDescription
        multivalued: true
      trainingEnergyConsumption:
        name: trainingEnergyConsumption
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: EnergyConsumptionDescription
        multivalued: true
    class_uri: https://spdx.org/rdf/3.0.1/terms/AI/EnergyConsumption
  EnergyConsumptionDescription:
    name: EnergyConsumptionDescription
    definition_uri: https://spdx.org/rdf/3.0.1/terms/EnergyConsumptionDescription
    annotations:
      shacl_node_kind:
        tag: shacl_node_kind
        value: sh:BlankNodeOrIRI
    description: 'The class that helps note down the quantity of energy consumption
      and the unit

      used for measurement.'
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/AI/EnergyConsumptionDescription
    slots:
    - EnergyConsumptionDescription_energyQuantity
    - EnergyConsumptionDescription_energyUnit
    slot_usage:
      energyQuantity:
        name: energyQuantity
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: decimal
        required: true
        multivalued: false
      energyUnit:
        name: energyUnit
        notes:
        - 'SHACL nodeKind: sh:IRI'
        - 'SHACL in: [ai:EnergyUnitType/kilowattHour, ai:EnergyUnitType/megajoule,
          ai:EnergyUnitType/other]'
        required: true
        multivalued: false
    class_uri: https://spdx.org/rdf/3.0.1/terms/AI/EnergyConsumptionDescription
  Build:
    name: Build
    definition_uri: https://spdx.org/rdf/3.0.1/terms/Build
    annotations:
      shacl_node_kind:
        tag: shacl_node_kind
        value: sh:IRI
    description: Class that describes a build instance of software/artifacts.
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/Build/Build
    is_a: Element
    slots:
    - Element_externalIdentifier
    - Element_extension
    - Element_summary
    - Element_description
    - Element_comment
    - Element_verifiedUsing
    - Element_externalRef
    - Element_name
    - Element_creationInfo
    - Build_buildType
    - Build_buildEndTime
    - Build_buildId
    - Build_configSourceDigest
    - Build_buildStartTime
    - Build_configSourceUri
    - Build_parameter
    - Build_configSourceEntrypoint
    - Build_environment
    slot_usage:
      buildType:
        name: buildType
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: uri
        required: true
        multivalued: false
      buildEndTime:
        name: buildEndTime
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: datetime
        multivalued: false
        pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
      buildId:
        name: buildId
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: false
      configSourceDigest:
        name: configSourceDigest
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: Hash
        multivalued: true
      buildStartTime:
        name: buildStartTime
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: datetime
        multivalued: false
        pattern: ^\d\d\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ$
      configSourceUri:
        name: configSourceUri
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: uri
        multivalued: true
      parameter:
        name: parameter
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: DictionaryEntry
        multivalued: true
      configSourceEntrypoint:
        name: configSourceEntrypoint
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: true
      environment:
        name: environment
        notes:
        - 'SHACL nodeKind: sh:BlankNodeOrIRI'
        range: DictionaryEntry
        multivalued: true
    class_uri: https://spdx.org/rdf/3.0.1/terms/Build/Build
  Agent:
    name: Agent
    definition_uri: https://spdx.org/rdf/3.0.1/terms/Agent
    annotations:
      shacl_node_kind:
        tag: shacl_node_kind
        value: sh:IRI
    description: Agent represents anything with the potential to act on a system.
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/Core/Agent
    is_a: Element
    abstract: true
    slots:
    - Element_externalIdentifier
    - Element_extension
    - Element_summary
    - Element_description
    - Element_comment
    - Element_verifiedUsing
    - Element_externalRef
    - Element_name
    - Element_creationInfo
    class_uri: https://spdx.org/rdf/3.0.1/terms/Core/Agent
  Annotation:
    name: Annotation
    definition_uri: https://spdx.org/rdf/3.0.1/terms/Annotation
    annotations:
      shacl_node_kind:
        tag: shacl_node_kind
        value: sh:IRI
    description: An assertion made in relation to one or more elements.
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/Core/Annotation
    is_a: Element
    slots:
    - Element_externalIdentifier
    - Element_extension
    - Element_summary
    - Element_description
    - Element_comment
    - Element_verifiedUsing
    - Element_externalRef
    - Element_name
    - Element_creationInfo
    - Annotation_contentType
    - Annotation_statement
    - Annotation_subject
    - Annotation_annotationType
    slot_usage:
      contentType:
        name: contentType
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: false
        pattern: ^[^\/]+\/[^\/]+$
      statement:
        name: statement
        notes:
        - 'SHACL nodeKind: sh:Literal'
        range: string
        multivalued: false
      subject:
        name: subject
        notes:
        - 'SHACL nodeKind: sh:IRI'
        range: Element
        required: true
        multivalued: false
      annotationType:
        name: annotationType
        notes:
