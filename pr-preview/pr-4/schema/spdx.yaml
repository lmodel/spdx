    definition_uri: https://spdx.org/rdf/3.0.1/terms/environment
    description: Property describing the session in which a build is invoked.
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/Build/environment
    slot_uri: https://spdx.org/rdf/3.0.1/terms/Build/environment
    owner: Build
    domain_of:
    - Build
    range: DictionaryEntry
    inlined: true
    inlined_as_list: true
