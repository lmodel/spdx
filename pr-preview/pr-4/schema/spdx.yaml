    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/energyConsumption
    owner: AIPackage
    domain_of:
    - AIPackage
    range: EnergyConsumption
    inlined: true
    inlined_as_list: true
  energyQuantity:
    name: energyQuantity
