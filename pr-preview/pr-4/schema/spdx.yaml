    definition_uri: https://spdx.org/rdf/3.0.1/terms/parameter
    description: Property describing a parameter used in an instance of a build.
    from_schema: https://w3id.org/lmodel/spdx
    mappings:
    - https://spdx.org/rdf/3.0.1/terms/Build/parameter
    slot_uri: https://spdx.org/rdf/3.0.1/terms/Build/parameter
