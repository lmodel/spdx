    mappings:
    - https://spdx.org/rdf/3.0.1/terms/AI/autonomyType
    slot_uri: https://spdx.org/rdf/3.0.1/terms/AI/autonomyType
    owner: AIPackage
    domain_of:
    - AIPackage
    range: PresenceType
  domain:
